<script>
// ===== Lector de "Acuerdo de liquidación de inventario" (independiente de la versión de pdf.js) =====
const SECCIONES = { "productos": "Productos", "bloqueados": "Bloqueados", "vacíos": "Vacíos", "vacios": "Vacíos", "activos": "Activos" };
const RE_RATIO = /^(\d+)\/(\d+)$/, RE_NUM = /^\d+$/, RE_DEN = /^\/(\d+)$/, RE_FECHA = /^\d{2}\/\d{2}\/\d{4}$/;

// items: [{str, x, top}] (top = distancia desde arriba). Une "3624" + "/1044" partidos en dos renglones.
function unirRatiosPartidos(items) {
  const usados = new Set(), nuevos = [];
  items.forEach((d, i) => {
    if (!RE_DEN.test(d.str)) return;
    let mejor = -1;
    items.forEach((n, j) => {
      if (usados.has(j) || !RE_NUM.test(n.str)) return;
      const dy = d.top - n.top;
      if (Math.abs(n.x - d.x) < 8 && dy > 0 && dy < 20 && (mejor < 0 || dy < d.top - items[mejor].top)) mejor = j;
    });
    if (mejor >= 0) {
      const n = items[mejor];
      usados.add(i); usados.add(mejor);
      nuevos.push({ str: n.str + d.str, x: n.x, top: (n.top + d.top) / 2 });
    }
  });
  return items.filter((_, k) => !usados.has(k)).concat(nuevos);
}

function agruparFilas(items, tol = 4) {
  const filas = [];
  [...items].sort((a, b) => a.top - b.top || a.x - b.x).forEach(it => {
    const f = filas[filas.length - 1];
    if (f && Math.abs(f.top - it.top) <= tol) f.items.push(it);
    else filas.push({ top: it.top, items: [it] });
  });
  filas.forEach(f => {
    f.items.sort((a, b) => a.x - b.x);
    f.tokens = []; // cada token conserva la x de su item
    f.items.forEach(it => it.str.split(/\s+/).filter(Boolean).forEach(t => f.tokens.push({ t, x: it.x })));
    f.texto = f.tokens.map(o => o.t).join(" ");
  });
  return filas;
}

// paginas: [{width, items:[{str,x,top}]}]
function parsearLiquidacion(paginas) {
  const enc = { conductor: "", viaje: "", placa: "", fechaEntrega: "", fechaRevision: "", revisor: "" };
  const lineas = [];
  let seccion = null;
  for (const pag of paginas) {
    const items = unirRatiosPartidos(pag.items.filter(i => i.str && i.str.trim()).map(i => ({ ...i, str: i.str.trim() })));
    const filas = agruparFilas(items);
    const mitad = pag.width / 2;
    filas.forEach((fila, k) => {
      const t = fila.texto, toks = fila.tokens.map(o => o.t);
      if (t.startsWith("Nombre del conductor") && filas[k + 1]) {
        if (!enc.viaje) {
          const vals = filas[k + 1].tokens.map(o => o.t);
          const fechas = vals.filter(v => RE_FECHA.test(v)), otros = vals.filter(v => !RE_FECHA.test(v));
          if (otros.length >= 3) {
            [enc.conductor, enc.viaje, enc.placa] = otros;
            enc.fechaEntrega = fechas[0] || ""; enc.fechaRevision = fechas[1] || "";
          }
        }
        return;
      }
      if (t.includes("Firma del revisor") && filas[k + 1] && !enc.revisor) {
        enc.revisor = filas[k + 1].tokens.filter(o => o.x < mitad).map(o => o.t).join(" ");
        return;
      }
      const primera = (toks[0] || "").toLowerCase();
      if (SECCIONES[primera] && t.includes("Inconsistencias")) { seccion = SECCIONES[primera]; return; }
      if (!seccion) return;
      const iR = toks.findIndex(x => RE_RATIO.test(x));
      if (iR < 2) return;
      const codigo = toks[iR - 1];
      if (!RE_NUM.test(codigo)) return;
      const [, x, y] = toks[iR].match(RE_RATIO);
      lineas.push({ seccion, codigo, nombre: toks.slice(0, iR - 1).join(" "),
        conductor: +x, sistema: +y, diferencia: (+x) - (+y) });
    });
  }
  return { enc, lineas };
}

// Lee un PDF (ArrayBuffer) con pdf.js y devuelve {enc, lineas}
async function leerPdf(pdfjsLib, buffer) {
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const paginas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    paginas.push({ width: vp.width, items: tc.items.map(it => ({ str: it.str, x: it.transform[4], top: vp.height - it.transform[5] })) });
  }
  return parsearLiquidacion(paginas);
}


</script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// =====================================================================
// Estado y persistencia
// =====================================================================
const KEY = "segsol_liquidaciones_v2";
const FUNCIONES = ["CHOFER", "REPARTO", "AUXILIAR", "AUXILIAR APOYO"];
const MEDIOS = ["Efectivo", "Yape", "Plin", "Transferencia", "Depósito", "Otro"];
let S = {
  precios: { caja: 3.8, grande: 0.6, chica: 0.5 },
  preciosProd: {},          // último precio usado por código de producto
  personal: [],             // {id, nombre, dni, funcion}
  vehiculos: [],            // {id, placa, bk}
  dias: {},                 // fecha -> {vehId: [{personaId, funcion}]}
  liqs: {}                  // id -> liquidación
};
try { const g = JSON.parse(localStorage.getItem(KEY) || "null"); if (g) S = Object.assign(S, g); } catch (e) {}
let LIBRO = null;
const guardar = () => { LIBRO = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("No se pudo guardar en este navegador."); } };

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtF = iso => iso ? iso.split("-").reverse().join("/") : "";
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const soles = (n, signo = true) => (signo ? (n < 0 ? "−" : n > 0 ? "+" : "") : "") + "S/ " + Math.abs(n).toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const und = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("es-PE");
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const sinTilde = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 2600); }

let FECHA = hoyISO();
let VISTA = "liquidar";
let LIQ_ABIERTA = null;
let FORM = { tipo: "pago", modo: "persona" };   // formulario de cobro

const persona = id => S.personal.find(p => p.id === id);
const vehiculo = id => S.vehiculos.find(v => v.id === id);
const tripDia = (fecha, vehId) => ((S.dias[fecha] || {})[vehId] || []).map(t => ({ ...t, p: persona(t.personaId) })).filter(t => t.p);
const liqDe = (fecha, vehId) => Object.values(S.liqs).find(l => l.fecha === fecha && l.vehId === vehId);
const placaCoincide = (a, b) => { const x = norm(a), y = norm(b); return !!x && !!y && (x === y || x.endsWith(y) || y.endsWith(x)); };

// tripulación de una liquidación: congelada al cerrar; mientras está abierta, la del día
function tripLiq(l) {
  if (l.estado === "cerrada" && l.tripulacion) return l.tripulacion;
  return tripDia(l.fecha, l.vehId).map(t => ({ personaId: t.personaId, nombre: t.p.nombre, dni: t.p.dni, funcion: t.funcion }));
}

// =====================================================================
// Cálculo de una liquidación
// =====================================================================
function infoEnvase(nombre, P) {
  const n = nombre.toUpperCase();
  if (n.includes("CAJA")) return { tipo: "Caja", precio: P.caja };
  if (n.includes("BOTELLA")) {
    let ml = null, m = n.match(/(\d+(?:[.,]\d+)?)\s*ML/);
    if (m) ml = parseFloat(m[1].replace(",", "."));
    else if ((m = n.match(/(\d+(?:[.,]\d+)?)\s*(LT|L)\b/))) ml = parseFloat(m[1].replace(",", ".")) * 1000;
    // sin "ML": tomar un número suelto de 3-4 cifras como medida (ej. "BOTELLA AMBAR BUD 600 RT")
    if (ml == null) { const s = n.match(/\b(\d{3,4})\b/); if (s && +s[1] >= 150 && +s[1] <= 3000) ml = +s[1]; }
    if (ml == null) return { tipo: "Botella (sin medida)", precio: null };
    return { tipo: "Botella " + ml + " ml", precio: ml >= 600 ? P.grande : P.chica };
  }
  return { tipo: "Otro", precio: null };
}

// ZPD7 quita faltante (+cantidad), ZPD4 agrega faltante (−cantidad)
function mapaAjustes(l) {
  const m = {};
  (l.ajustes || []).forEach(a => { if (a.codigo === "ZPD7" || a.codigo === "ZPD4") m[a.mat] = (m[a.mat] || 0) + (a.codigo === "ZPD7" ? a.cantidad : -a.cantidad); });
  return m;
}
function calcBase(l) {
  const P = l.estado === "cerrada" && l.precios ? l.precios : S.precios;
  const r = { lineas: [], bot: 0, caj: 0, prod: 0, sobr: 0, falt: 0, prodMonto: 0, prodSinPrecio: 0 };
  const AJ = mapaAjustes(l);
  for (const lnPdf of (l.pdf ? l.pdf.lineas : [])) {
    const aj = AJ[lnPdf.seccion + "|" + lnPdf.codigo] || 0;
    if (!lnPdf.diferencia && !aj) continue;
    const ln = { ...lnPdf, difPdf: lnPdf.diferencia, ajuste: aj, diferencia: lnPdf.diferencia + aj };
    const x = { ...ln, tipo: "", precio: null, dinero: null };
    if (ln.seccion === "Vacíos") {
      const e = infoEnvase(ln.nombre, P); x.tipo = e.tipo; x.precio = e.precio;
      if (e.precio != null) { x.dinero = r2(ln.diferencia * e.precio); if (x.dinero > 0) r.sobr += x.dinero; else r.falt += x.dinero; }
      if (e.tipo === "Caja") r.caj += ln.diferencia; else if (e.tipo.startsWith("Botella")) r.bot += ln.diferencia;
    } else if (ln.seccion === "Productos") {
      r.prod += ln.diferencia;
      if (l.incluirProductos) {
        const pr = (l.preciosProd || {})[ln.codigo];
        if (pr != null && pr !== "") { x.precio = +pr; x.dinero = r2(ln.diferencia * pr); if (x.dinero > 0) r.sobr += x.dinero; else r.falt += x.dinero; r.prodMonto += x.dinero; }
        else r.prodSinPrecio++;
      }
    }
    r.lineas.push(x);
  }
  r.sobr = r2(r.sobr); r.falt = r2(r.falt); r.prodMonto = r2(r.prodMonto);
  r.neto = r2(r.sobr + r.falt);
  r.aCobrar = r.neto < 0 ? r2(-r.neto) : 0;
  r.aFavor = r.neto > 0 ? r.neto : 0;
  r.aCobrarBase = r.aCobrar;
  const cob = l.cobros || [];
  r.pagado = r2(cob.filter(c => c.tipo === "pago").reduce((a, c) => a + c.monto, 0));
  r.descontado = r2(cob.filter(c => c.tipo === "descuento").reduce((a, c) => a + c.monto, 0));
  r.cubierto = r2(r.pagado + r.descontado);
  r.pendiente = r2(r.aCobrar - r.cubierto);
  return r;
}

// =====================================================================
// Saldo a favor: el sobrante neto de una liquidación CERRADA queda para el tripulante con rol REPARTO
// y cubre automáticamente sus faltantes de los 3 días siguientes. Luego vence y queda solo en historial.
// =====================================================================
const DIAS_SALDO = 3;
const addDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const pkey = o => o.personaId || (o.dni ? "dni:" + o.dni : "n:" + sinTilde(o.nombre || ""));
const repartoDe = l => tripLiq(l).find(t => String(t.funcion).toUpperCase() === "REPARTO");
function libro() {
  if (LIBRO) return LIBRO;
  const all = Object.values(S.liqs).filter(l => l.pdf);
  const base = {}; all.forEach(l => base[l.id] = calcBase(l));
  const fuentes = {}, aplicado = {};
  all.filter(l => l.estado === "cerrada" && base[l.id].aFavor > 0).forEach(l => {
    const rep = repartoDe(l); if (!rep) return;
    fuentes[l.id] = { id: l.id, l, owner: { key: pkey(rep), nombre: rep.nombre, dni: rep.dni || "" }, monto: base[l.id].aFavor,
      fecha: l.fecha, vence: addDias(l.fecha, DIAS_SALDO), saldo: base[l.id].aFavor, usos: [] };
  });
  // liquidaciones cerradas: lo que usaron quedó guardado al cerrar
  all.filter(l => l.estado === "cerrada").forEach(l => {
    aplicado[l.id] = (l.creditos || []).slice();
    aplicado[l.id].forEach(u => { const f = fuentes[u.src]; if (f) { f.saldo = r2(f.saldo - u.monto); f.usos.push({ l, monto: u.monto }); } });
  });
  // liquidaciones abiertas con faltante: usan el saldo vigente de su tripulación, del más antiguo al más nuevo
  all.filter(l => l.estado !== "cerrada" && base[l.id].aCobrar > 0)
    .sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.creado || a.id).localeCompare(b.creado || b.id)).forEach(l => {
      const keys = new Set(tripLiq(l).map(pkey)); let falta = base[l.id].aCobrar; const us = [];
      Object.values(fuentes).filter(f => f.saldo > 0 && keys.has(f.owner.key) && f.fecha < l.fecha && l.fecha <= f.vence)
        .sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(f => {
          if (falta <= 0) return;
          const t = r2(Math.min(falta, f.saldo)); f.saldo = r2(f.saldo - t); falta = r2(falta - t);
          f.usos.push({ l, monto: t }); us.push({ src: f.id, monto: t, nombre: f.owner.nombre, fecha: f.fecha });
        });
      aplicado[l.id] = us;
    });
  const hoy = hoyISO();
  Object.values(fuentes).forEach(f => { f.estado = f.saldo <= 0 ? "Aplicado" : hoy > f.vence ? "Vencido" : "Vigente"; });
  return (LIBRO = { base, fuentes, aplicado });
}
function calc(l) {
  const r = calcBase(l);
  const us = l.pdf ? (libro().aplicado[l.id] || []) : [];
  r.creditos = us; r.credito = r2(us.reduce((a, u) => a + u.monto, 0));
  r.aCobrar = r2(Math.max(0, r.aCobrarBase - r.credito));
  r.pendiente = r2(r.aCobrar - r.cubierto);
  r.fuente = l.pdf ? (libro().fuentes[l.id] || null) : null;
  return r;
}

function estadoTag(l) {
  if (!l || !l.pdf) return `<span class="tag ok">Pendiente</span>`;
  if (l.estado === "cerrada") return `<span class="tag pos">Cerrada</span>`;
  return `<span class="tag warn">En proceso</span>`;
}

async function leerArchivo(f) {
  const { enc, lineas } = await leerPdf(pdfjsLib, await f.arrayBuffer());
  if (!enc.viaje || !lineas.length) throw new Error('no parece un "Acuerdo de liquidación de inventario"');
  const m = String(enc.viaje).trim().match(/^R(\d+)[-_ ]?(.+)$/i);
  return { archivo: f.name, enc, lineas, base: m ? m[2] : enc.viaje.trim(), rep: m ? +m[1] : 0 };
}

// asigna un PDF leído a la liquidación (fecha, vehículo). Devuelve [clase, mensaje]
function asignarPdf(pdf, fecha, vehId) {
  const v = vehiculo(vehId);
  const otra = Object.values(S.liqs).find(l => l.pdf && l.pdf.base === pdf.base && !(l.fecha === fecha && l.vehId === vehId));
  if (otra) {
    const vo = vehiculo(otra.vehId);
    if (otra.pdf.rep >= pdf.rep) return ["m-err", `${pdf.archivo}: el viaje ${pdf.base} ya está liquidado en ${vo ? vo.placa : "otro vehículo"} (${fmtF(otra.fecha)}).`];
    if (otra.estado === "cerrada") return ["m-err", `${pdf.archivo}: es el reproceso R${pdf.rep} del viaje ${pdf.base}, pero esa liquidación (${fmtF(otra.fecha)}) ya está cerrada. Reábrela primero.`];
    delete S.liqs[otra.id];
  }
  let l = liqDe(fecha, vehId);
  if (l && l.estado === "cerrada") return ["m-err", `${pdf.archivo}: la liquidación de ${v.placa} ya está cerrada. Reábrela para cambiar el PDF.`];
  if (l && l.pdf && l.pdf.base === pdf.base && l.pdf.rep > pdf.rep) return ["m-warn", `${pdf.archivo}: ya está cargado el reproceso R${l.pdf.rep}, que es más reciente. Omitido.`];
  if (!l) { l = { id: uid(), creado: new Date().toISOString(), fecha, vehId, cobros: [], estado: "abierta", incluirProductos: false, preciosProd: {} }; S.liqs[l.id] = l; }
  l.pdf = pdf;
  const aviso = placaCoincide(pdf.enc.placa, v.placa) ? "" : ` ⚠ La placa del PDF (${pdf.enc.placa}) no coincide con ${v.placa}.`;
  return [aviso ? "m-warn" : "m-ok", `${pdf.archivo}: viaje ${pdf.enc.viaje} cargado en ${v.placa}${v.bk ? " — " + v.bk : ""}.${aviso}`];
}

async function cargarPdfs(files, vehId, abrir) {
  MSGS = [];
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) { MSGS.push(["m-warn", `${f.name}: no es PDF, omitido.`]); continue; }
    try {
      const pdf = await leerArchivo(f);
      let destino = vehId;
      if (!destino) {
        const v = S.vehiculos.find(v => placaCoincide(v.placa, pdf.enc.placa));
        if (!v) { MSGS.push(["m-err", `${f.name}: la placa ${pdf.enc.placa} no está registrada en Vehículos.`]); continue; }
        destino = v.id;
      }
      MSGS.push(asignarPdf(pdf, FECHA, destino));
    } catch (err) { console.error(err); MSGS.push(["m-err", `${f.name}: no se pudo leer (${err.message || err}).`]); }
  }
  guardar();
  if (abrir && vehId) { const l = liqDe(FECHA, vehId); if (l) { LIQ_ABIERTA = l.id; } toastMsgs(); render(); pintarPanel(); }
  else render();
}

    <div class="ptop"><h2>Detalle de liquidación — ${esc(v.placa)}${v.bk ? " — " + esc(v.bk) : ""}</h2>
      <div class="row">${estadoTag(l)} <button id="pCerrar">✕ Cerrar</button></div></div>
    <div class="card" style="padding:12px 14px">
      <div class="row" style="align-items:center"><b>Tripulación (${fmtF(l.fecha)}):</b>
        ${trip.length ? trip.map(t => `<span class="chip" style="cursor:default">${esc(t.nombre)} <small>${esc(t.funcion)}${t.dni ? " · " + esc(t.dni) : ""}</small></span>`).join("")
          : `<span class="vacio">Sin tripulación asignada. Puedes asignarla en “Tripulación del día”.</span>`}</div>
    </div>
    ${!l.pdf ? `<div class="card"><div class="drop" id="pDrop"><b>Arrastra aquí el PDF de liquidación de ${esc(v.placa)}</b> o haz clic para elegirlo
        <small>Se leerán las diferencias de productos, bloqueados y vacíos.</small></div><div class="msgs">${MSGS.map(([k, t]) => `<div class="${k}">${esc(t)}</div>`).join("")}</div></div>` : `
    <div class="enc">
      <div><span>Conductor</span><b>${esc(e.conductor)}</b></div>
      <div><span>Nº de viaje</span><b>${esc(e.viaje)}</b></div>
      <div><span>Placa</span><b>${esc(e.placa)}</b></div>
      <div><span>Fecha de entrega</span><b>${esc(e.fechaEntrega)}</b></div>
      <div><span>Fecha de revisión</span><b>${esc(e.fechaRevision)}</b></div>
      <div><span>Revisor</span><b>${esc(e.revisor)}</b></div>
    </div>
    ${!placaCoincide(e.placa, v.placa) ? `<div class="card m-warn" style="padding:10px 14px">⚠ La placa del PDF (${esc(e.placa)}) no coincide con el vehículo ${esc(v.placa)}.</div>` : ""}
    <div class="kpis">
      <div class="kpi"><span>Botellas (neto)</span><b class="${cls(c.bot)}">${und(c.bot)}</b></div>
      <div class="kpi"><span>Cajas (neto)</span><b class="${cls(c.caj)}">${und(c.caj)}</b></div>
      <div class="kpi"><span>Sobrante</span><b class="pos">${soles(c.sobr)}</b></div>
      <div class="kpi"><span>Faltante</span><b class="neg">${soles(c.falt)}</b></div>
      <div class="kpi"><span>Neto</span><b class="${cls(c.neto)}">${soles(c.neto)}</b></div>
    </div>
    ${tablaSeccion("Productos", secs.has("Productos"), c.lineas, "productos", l)}
    ${l.incluirProductos && c.prodSinPrecio ? `<p class="ayuda m-warn">Hay ${c.prodSinPrecio} producto(s) sin precio: no suman al cobro hasta que les pongas precio.</p>` : ""}
    ${tablaSeccion("Bloqueados", secs.has("Bloqueados"), c.lineas, "otros", l)}
    ${tablaSeccion("Vacíos", secs.has("Vacíos"), c.lineas, "vacios", l)}
    ${secs.has("Activos") ? tablaSeccion("Activos", true, c.lineas, "otros", l) : ""}
    <p class="ayuda">Archivo: ${esc(l.pdf.archivo)}${l.pdf.rep ? ` · Reproceso R${l.pdf.rep}` : ""}
      ${!cerrada ? ` · <a href="#" id="pCambiar">Cambiar PDF</a>` : ""}</p>
    ${seccionAjustes(l)}
    ${seccionCobro(l, c, trip)}`}`;

  $("pCerrar").onclick = cerrarPanel;
  const pd = $("pDrop");
  if (pd) {
    pd.onclick = () => { $("filePdf").dataset.veh = l.vehId; $("filePdf").click(); };
    pd.ondragover = ev => { ev.preventDefault(); pd.classList.add("over"); };
    pd.ondragleave = () => pd.classList.remove("over");
    pd.ondrop = ev => { ev.preventDefault(); pd.classList.remove("over"); FECHA_PDF(l); cargarPdfs([...ev.dataTransfer.files].slice(0, 1), l.vehId, true); };
    pd.onclick = () => { FECHA_PDF(l); $("filePdf").dataset.veh = l.vehId; $("filePdf").click(); };
  }
  const pc = $("pCambiar");
  if (pc) pc.onclick = ev => { ev.preventDefault(); FECHA_PDF(l); $("filePdf").dataset.veh = l.vehId; $("filePdf").click(); };
  const chk = $("chkProd");
  if (chk) chk.onchange = () => { l.incluirProductos = chk.checked; guardar(); pintarPanel(); render(); };
  $("hoja").querySelectorAll("input.precio").forEach(inp => inp.onchange = () => {
    const val = inp.value === "" ? null : Math.max(0, +inp.value);
    l.preciosProd = l.preciosProd || {};
    if (val == null) delete l.preciosProd[inp.dataset.cod]; else { l.preciosProd[inp.dataset.cod] = val; S.preciosProd[inp.dataset.cod] = val; }
    guardar(); pintarPanel(); render();
  });
  if (chk && chk.checked) {   // precarga precios recordados
    let cambio = false;
    c.lineas.filter(x => x.seccion === "Productos").forEach(x => {
      if ((l.preciosProd || {})[x.codigo] == null && S.preciosProd[x.codigo] != null) { l.preciosProd[x.codigo] = S.preciosProd[x.codigo]; cambio = true; }
    });
    if (cambio) { guardar(); pintarPanel(); return; }
  }
  enlazarAjustes(l);
  enlazarCobro(l, c, trip);
}

function seccionAjustes(l) {
  const cerrada = l.estado === "cerrada";
  const aj = l.ajustes || [];
  const efecto = a => a.codigo === "ZPD7" ? `Quita faltante (+${a.cantidad})` : a.codigo === "ZPD4" ? `Agrega faltante (−${a.cantidad})` : "Comentario";
  const mats = l.pdf.lineas.map((x, i) => ({ x, i })).sort((a, b) => (b.x.diferencia !== 0) - (a.x.diferencia !== 0));
  return `
    <h3>Ajustes y comentarios (ZPD7 / ZPD4) ${aj.length ? `<span class="tag azul">${aj.length}</span>` : ""}</h3>
    <p class="ayuda" style="margin-top:0"><b>ZPD7</b> quita mercadería faltante (−24 con ZPD7 24 → 0). <b>ZPD4</b> agrega faltante (−24 con ZPD4 24 → −48). El ajuste cambia la diferencia y el dinero de la liquidación.</p>
    ${aj.length ? `<div class="card scroll" style="padding:0"><table><thead><tr><th>Código</th><th>Material</th><th class="num">Cantidad</th><th>Efecto</th><th>Comentario</th><th>Registrado</th><th></th></tr></thead><tbody>
      ${aj.map(a => `<tr><td><span class="tag ${a.codigo === "ZPD7" ? "pos" : a.codigo === "ZPD4" ? "neg" : "ok"}">${esc(a.codigo === "COMENTARIO" ? "Nota" : a.codigo)}</span></td>
        <td>${a.mat ? esc(a.seccion + " · " + a.codigoMat + " — " + a.nombre) : "—"}</td><td class="num">${a.codigo === "COMENTARIO" ? "—" : a.cantidad}</td>
        <td>${efecto(a)}</td><td>${esc(a.comentario || "")}</td><td style="font-size:11.5px;color:var(--muted)">${new Date(a.fecha).toLocaleString("es-PE")}</td>
        <td>${cerrada ? "" : `<button class="x" data-delaj="${a.id}" title="Quitar">✕</button>`}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    ${cerrada ? "" : `<div class="cobro-form">
      <div class="row">
        <label class="f">Código<select id="ajCod"><option value="ZPD7">ZPD7 – quita faltante</option><option value="ZPD4">ZPD4 – agrega faltante</option><option value="COMENTARIO">Solo comentario</option></select></label>
        <label class="f grow" id="ajMatW">Material<select id="ajMat">${mats.map(({ x, i }) => `<option value="${i}">${esc(x.seccion)} · ${esc(x.codigo)} — ${esc(x.nombre)} (PDF ${und(x.diferencia)})</option>`).join("")}</select></label>
        <label class="f" id="ajCantW">Cantidad<input id="ajCant" type="number" min="1" step="1" style="width:100px"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="f grow">Comentario<input id="ajCom" placeholder="Ej. ZPD7 aprobado por supervisor, botellas devueltas en almacén"></label>
        <button class="primary" id="ajAdd">Agregar</button>
      </div>
      <div class="msgs"><div class="m-err" id="ajErr"></div></div>
    </div>`}`;
}
function enlazarAjustes(l) {
  const h = $("hoja");
  h.querySelectorAll("[data-delaj]").forEach(b => b.onclick = () => { l.ajustes = (l.ajustes || []).filter(a => a.id !== b.dataset.delaj); guardar(); pintarPanel(); render(); });
  const cod = $("ajCod"); if (!cod) return;
  const toggle = () => { const sc = cod.value === "COMENTARIO"; $("ajCantW").style.display = sc ? "none" : ""; };
  cod.onchange = toggle; toggle();
  $("ajAdd").onclick = () => {
    const err = t => $("ajErr").textContent = t;
    const codigo = cod.value, com = $("ajCom").value.trim();
    const x = l.pdf.lineas[+$("ajMat").value];
    const a = { id: uid(), codigo, comentario: com, fecha: new Date().toISOString(), cantidad: 0, mat: "", seccion: "", codigoMat: "", nombre: "" };
    if (codigo === "COMENTARIO") {
      if (!com) return err("Escribe el comentario.");
      if (x) Object.assign(a, { mat: x.seccion + "|" + x.codigo, seccion: x.seccion, codigoMat: x.codigo, nombre: x.nombre });
    } else {
      const cant = Math.round(+$("ajCant").value);
      if (!x) return err("Elige el material.");
      if (!(cant > 0)) return err("Ingresa la cantidad (número entero mayor a 0).");
      Object.assign(a, { cantidad: cant, mat: x.seccion + "|" + x.codigo, seccion: x.seccion, codigoMat: x.codigo, nombre: x.nombre });
    }
    (l.ajustes = l.ajustes || []).push(a);
    guardar(); pintarPanel(); render();
  };
}
// el PDF que se carga desde el panel va a la fecha de la liquidación abierta

function seccionCobro(l, c, trip) {
  const cerrada = l.estado === "cerrada";
  const filas = (l.cobros || []).map(x => `<tr>
      <td><span class="tag ${x.tipo === "pago" ? "pos" : "neg"}">${x.tipo === "pago" ? "Pago" : "Descuento"}</span></td>
      <td>${esc(x.nombre)}${x.dni ? `<br><small class="ayuda">DNI ${esc(x.dni)}</small>` : ""}</td>
      <td>${x.tipo === "pago" ? esc(x.medio) + (x.operacion ? ` · Op. ${esc(x.operacion)}` : "") : esc({ persona: "Tripulante", tripulacion: "Toda la tripulación (partes iguales)", otro: "Otra persona" }[x.modo] || "")}</td>

    form = `<div class="cobro-form">
      <div class="row" style="margin-bottom:10px">
        <div class="seg"><button data-tipo="pago" class="${FORM.tipo === "pago" ? "on" : ""}">💵 Registrar pago</button><button data-tipo="descuento" class="${FORM.tipo === "descuento" ? "on" : ""}">📉 Enviar a descuento</button></div>
      </div>

      <div class="row">
        <label class="f grow">¿Quién paga?
          <select id="cPersona">${opcTrip ? `<optgroup label="Tripulación">${opcTrip}</optgroup>` : ""}${otrasP ? `<optgroup label="Otro personal">${otrasP}</optgroup>` : ""}<option value="__otro">Otra persona (escribir)…</option></select></label>
        <label class="f" id="cOtroWrap" style="display:none">Nombre<input id="cOtroNombre" placeholder="Nombre completo"></label>
        <label class="f" id="cOtroDniWrap" style="display:none">DNI<input id="cOtroDni" placeholder="DNI" inputmode="numeric"></label>
        <label class="f">Medio<select id="cMedio">${MEDIOS.map(x => `<option>${x}</option>`).join("")}</select></label>
        <label class="f">Nº operación<input id="cOp" placeholder="Opcional" style="width:120px"></label>
        <label class="f">Monto (S/)<input id="cMonto" type="number" step="0.01" min="0.01" value="${montoDef}" style="width:110px"></label>
        <button class="primary" id="cAgregar">Agregar pago</button>
      </div>` : `
      <div class="row">
        <label class="f">Descontar a
          <select id="cModo">
            <option value="persona" ${FORM.modo === "persona" ? "selected" : ""}>Un tripulante</option>
            <option value="tripulacion" ${FORM.modo === "tripulacion" ? "selected" : ""} ${trip.length ? "" : "disabled"}>Toda la tripulación (partes iguales)</option>
            <option value="otro" ${FORM.modo === "otro" ? "selected" : ""}>Otra persona</option>
          </select></label>
        ${FORM.modo === "persona" ? `<label class="f grow">Tripulante<select id="cPersona">${opcTrip || `<option value="">— sin tripulación —</option>`}</select></label>` : ""}
        ${FORM.modo === "otro" ? `<label class="f grow">Persona<select id="cPersona">${otrasP}<option value="__otro">Escribir nombre…</option></select></label>
          <label class="f" id="cOtroWrap" style="display:none">Nombre<input id="cOtroNombre" placeholder="Nombre completo"></label>
          <label class="f" id="cOtroDniWrap" style="display:none">DNI<input id="cOtroDni" placeholder="DNI" inputmode="numeric"></label>` : ""}
        ${FORM.modo === "tripulacion" ? `<div class="grow ayuda" style="margin:0 0 8px">Se dividirá entre ${trip.length} persona(s): ${trip.map(t => esc(t.nombre)).join(", ")}.</div>` : ""}
        <label class="f">Monto (S/)<input id="cMonto" type="number" step="0.01" min="0.01" value="${montoDef}" style="width:110px"></label>
        <button class="primary" id="cAgregar">Agregar descuento</button>
      </div>`}
      <div class="msgs"><div class="m-err" id="cErr"></div></div>
    </div>`;
  }
  return `
    <h3>Cobro de la liquidación</h3>
    <div class="estado-cobro">
      ${c.aFavor ? `<div>Sobrante a favor<br><b class="pos">${soles(c.aFavor, false)}</b></div>` : ""}
      ${c.credito ? `<div>Faltante neto<br><b>${soles(c.aCobrarBase, false)}</b></div><div>Saldo a favor aplicado<br><b class="pos">−${soles(c.credito, false)}</b></div>` : ""}
      <div>A cobrar${c.credito ? "" : " (neto)"}<br><b>${soles(c.aCobrar, false)}</b></div>
      <div>Pagado<br><b class="pos">${soles(c.pagado, false)}</b></div>
      <div>Descuento<br><b class="neg">${soles(c.descontado, false)}</b></div>
      <div>Pendiente<br><b class="${c.pendiente > 0 ? "neg" : "pos"}">${soles(Math.max(c.pendiente, 0), false)}</b></div>
      <div style="margin-left:auto" class="row">
        ${cerrada ? `<span class="ayuda" style="margin:0">Cerrada el ${new Date(l.cerradaEn).toLocaleString("es-PE")}</span><button id="cReabrir">Reabrir</button>`
          : `<button class="ok" id="cCerrarLiq" ${c.pendiente === 0 ? "" : "disabled"} title="${c.pendiente > 0 ? "Falta cubrir el monto pendiente con pagos o descuentos" : ""}">✔ Cerrar liquidación</button>`}
      </div>

    ${c.creditos.map(u => `<p class="ayuda pos" style="margin:6px 0 0">✔ Se cubrió ${soles(u.monto, false)} con el saldo a favor de <b>${esc(u.nombre)}</b> (sobrante del ${fmtF(u.fecha)}).</p>`).join("")}
    ${infoSaldo(l, c, trip)}
    ${c.aCobrar === 0 && !cerrada ? `<p class="ayuda">No hay nada que cobrar. Puedes cerrar la liquidación.</p>` : ""}
    ${c.pendiente < 0 ? `<p class="ayuda m-err">Lo registrado supera lo que se debe cobrar en ${soles(-c.pendiente, false)}. Quita o corrige algún pago o descuento.</p>` : ""}
    ${filas ? `<div class="card scroll" style="padding:0;margin-top:10px"><table><thead><tr><th>Tipo</th><th>Persona</th><th>Medio / detalle</th><th class="num">Monto</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>` : ""}
    ${form}
    ${cerrada ? (l.comentarioCierre ? `<div class="card" style="margin-top:10px;padding:12px 14px"><b>💬 Comentario de cierre:</b> ${esc(l.comentarioCierre)}</div>` : "")
      : `<label class="f" style="margin-top:12px">💬 Comentario de cierre (opcional)<textarea id="cComent" placeholder="Ej. Se coordinó con el supervisor; el chofer devolverá las cajas mañana.">${esc(l.comentarioCierre || "")}</textarea></label>`}`;
}
function infoSaldo(l, c, trip) {
  if (!c.aFavor) return "";
  const f = c.fuente, box = t => `<div class="card" style="margin-top:10px;padding:10px 14px;border-color:#bfe3c9;background:#f3fbf5">${t}</div>`;
  if (l.estado !== "cerrada") {
    const rep = trip.find(t => String(t.funcion).toUpperCase() === "REPARTO");
    return box(rep ? `💚 Al cerrar, el sobrante de <b>${soles(c.aFavor, false)}</b> quedará como saldo a favor de <b>${esc(rep.nombre)}</b> (REPARTO) para cubrir sus faltantes hasta el <b>${fmtF(addDias(l.fecha, DIAS_SALDO))}</b>.`
      : `⚠ No hay tripulante con rol <b>REPARTO</b>: el sobrante de ${soles(c.aFavor, false)} quedará solo en el historial.`);
  }
  if (!f) return box(`El sobrante de ${soles(c.aFavor, false)} quedó solo en el historial (no había tripulante con rol REPARTO).`);
  const est = { Vigente: `<span class="tag pos">Vigente hasta ${fmtF(f.vence)}</span>`, Aplicado: `<span class="tag azul">Aplicado</span>`, Vencido: `<span class="tag ok">Vencido el ${fmtF(f.vence)} · queda en historial</span>` }[f.estado];
  return box(`💚 Saldo a favor de <b>${esc(f.owner.nombre)}</b> (REPARTO): ${soles(f.monto, false)} · disponible <b>${soles(Math.max(f.saldo, 0), false)}</b> ${est}
    ${f.usos.map(u => { const v = vehiculo(u.l.vehId) || {}; return `<div class="ayuda" style="margin:4px 0 0">Usado ${soles(u.monto, false)} en ${esc(v.placa)} (${fmtF(u.l.fecha)})${u.l.estado !== "cerrada" ? " · liquidación en proceso" : ""}</div>`; }).join("")}`);
}

function enlazarCobro(l, c, trip) {
  const h = $("hoja");
  h.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { FORM.tipo = b.dataset.tipo; pintarPanel(); });
  const modo = $("cModo"); if (modo) modo.onchange = () => { FORM.modo = modo.value; pintarPanel(); };
  const sel = $("cPersona");
  const toggleOtro = () => { const o = sel && sel.value === "__otro"; ["cOtroWrap", "cOtroDniWrap"].forEach(id => { const x = $(id); if (x) x.style.display = o ? "" : "none"; }); };
  if (sel) { sel.onchange = toggleOtro; toggleOtro(); }
  h.querySelectorAll("[data-delcob]").forEach(b => b.onclick = () => {
    const x = l.cobros.find(k => k.id === b.dataset.delcob);
    l.cobros = l.cobros.filter(k => x.grupo ? k.grupo !== x.grupo : k.id !== x.id);
    guardar(); pintarPanel(); render();
  });
  const add = $("cAgregar");
  if (add) add.onclick = () => {
    const err = t => { $("cErr").textContent = t; };
    const monto = r2(+$("cMonto").value);
    if (!(monto > 0)) return err("Ingresa un monto mayor a 0.");
    if (monto > c.pendiente + 0.001) return err(`El monto no puede superar lo pendiente (${soles(c.pendiente, false)}).`);
    const quien = () => {
      if (!sel || !sel.value) return null;
      if (sel.value === "__otro") {
        const n = $("cOtroNombre").value.trim(); if (!n) return null;
        return { personaId: null, nombre: n, dni: $("cOtroDni").value.trim() };
      }
      const p = persona(sel.value); return p ? { personaId: p.id, nombre: p.nombre, dni: p.dni || "" } : null;
    };
    if (FORM.tipo === "pago") {
      const q = quien(); if (!q) return err("Indica quién realiza el pago.");
      l.cobros.push({ id: uid(), tipo: "pago", ...q, medio: $("cMedio").value, operacion: $("cOp").value.trim(), monto, modo: "persona", fecha: new Date().toISOString() });
    } else if (FORM.modo === "tripulacion") {
      if (!trip.length) return err("No hay tripulación asignada.");
      const cent = Math.round(monto * 100), base = Math.floor(cent / trip.length), resto = cent - base * trip.length, grupo = uid();
      trip.forEach((t, i) => l.cobros.push({ id: uid(), tipo: "descuento", personaId: t.personaId, nombre: t.nombre, dni: t.dni || "", monto: (base + (i < resto ? 1 : 0)) / 100, modo: "tripulacion", grupo, fecha: new Date().toISOString() }));
    } else {
      const q = quien(); if (!q) return err("Indica a quién se le descuenta.");
      l.cobros.push({ id: uid(), tipo: "descuento", ...q, monto, modo: FORM.modo, fecha: new Date().toISOString() });
    }
    guardar(); pintarPanel(); render();
  };
  const cm = $("cComent");
  if (cm) cm.oninput = () => { l.comentarioCierre = cm.value; clearTimeout(cm._t); cm._t = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 400); };
  const cl = $("cCerrarLiq");
  if (cl) cl.onclick = () => {
    LIBRO = null;
    const cc = calc(l); if (cc.pendiente !== 0) return;
    l.creditos = cc.creditos.map(u => ({ ...u }));
    if (cm) l.comentarioCierre = cm.value.trim();
    l.estado = "cerrada"; l.cerradaEn = new Date().toISOString();
    l.precios = { ...S.precios }; l.tripulacion = tripLiq({ ...l, estado: "abierta" });
    guardar(); toast("Liquidación cerrada."); pintarPanel(); render();
  };
  const ra = $("cReabrir");
  if (ra) ra.onclick = () => {

function coincideTexto(q, l, v, trip, extra = "") {
  if (!q) return true;

// ---------- Trazabilidad por colaborador
function indiceColab() {
  const idx = {};
  const get = (o, k = pkey(o)) => idx[k] = idx[k] || { key: k, nombre: o.nombre, dni: o.dni || "", ev: [] };
  S.personal.forEach(p => get({ personaId: p.id, nombre: p.nombre, dni: p.dni }));
  const L = libro();
  Object.values(S.liqs).filter(l => l.pdf).forEach(l => {
    const v = vehiculo(l.vehId) || {}, c = calc(l);
    tripLiq(l).forEach(t => get(t).ev.push({ fecha: l.fecha, l, v, tipo: "Liquidación",
      det: `${t.funcion} · viaje ${l.pdf.enc.viaje} · ${l.estado === "cerrada" ? "cerrada" : "en proceso"}${(l.ajustes || []).length ? ` · ${l.ajustes.length} ajuste(s) ZPD/nota` : ""}${l.comentarioCierre ? ` · “${l.comentarioCierre}”` : ""}`, monto: c.neto, nota: "Neto del vehículo" }));
    (l.cobros || []).forEach(x => get(x).ev.push({ fecha: l.fecha, l, v, tipo: x.tipo === "pago" ? "Pago" : "Descuento",
      det: x.tipo === "pago" ? `${x.medio}${x.operacion ? " · Op. " + x.operacion : ""}` : (x.modo === "tripulacion" ? "Partes iguales con la tripulación" : "Descuento directo"),
      monto: x.tipo === "pago" ? x.monto : -x.monto }));
  });
  Object.values(L.fuentes).forEach(f => {
    const p = get({ nombre: f.owner.nombre, dni: f.owner.dni }, f.owner.key), v = vehiculo(f.l.vehId) || {};
    p.ev.push({ fecha: f.fecha, l: f.l, v, tipo: "Saldo a favor generado", det: `Sobrante de vacíos · vence ${fmtF(f.vence)} · ${f.estado}`, monto: f.monto });
    f.usos.forEach(u => p.ev.push({ fecha: u.l.fecha, l: u.l, v: vehiculo(u.l.vehId) || {}, tipo: "Saldo a favor aplicado", det: `Cubrió faltante (saldo del ${fmtF(f.fecha)})`, monto: -u.monto }));
    if (f.estado === "Vencido") p.ev.push({ fecha: f.vence, l: f.l, v, tipo: "Saldo vencido", det: "Ya no se puede usar · queda como sobrante en historial", monto: -f.saldo });
  });
  Object.values(idx).forEach(p => p.ev.sort((a, b) => b.fecha.localeCompare(a.fecha)));
  return idx;
}

function resumenColab(p) {
  const ev = p.ev.filter(e => (!TZ.desde || e.fecha >= TZ.desde) && (!TZ.hasta || e.fecha <= TZ.hasta));
  const sum = t => r2(ev.filter(e => e.tipo === t).reduce((a, e) => a + Math.abs(e.monto), 0));
  const vig = Object.values(libro().fuentes).filter(f => f.owner.key === p.key && f.estado === "Vigente").reduce((a, f) => a + f.saldo, 0);
  return { ev, liqs: ev.filter(e => e.tipo === "Liquidación").length, pagado: sum("Pago"), descontado: sum("Descuento"),
    generado: sum("Saldo a favor generado"), aplicado: sum("Saldo a favor aplicado"), vencido: sum("Saldo vencido"), vigente: r2(vig) };
}

// =====================================================================
// VISTA: Tripulación del día (arrastrar personas a los vehículos)
// =====================================================================
let BUSCA_P = "";
let HIST_ABIERTO = new Set();
const hayQ = (q, txt) => !q || sinTilde(q).split(/\s+/).filter(Boolean).every(w => sinTilde(txt).includes(w) || norm(txt).includes(norm(w)));
// todas las filas (vehículo) de una fecha: tripulación asignada y/o liquidación cargada
function filasDia(fecha) {
  const ids = new Set(Object.keys(S.dias[fecha] || {}));
  Object.values(S.liqs).forEach(l => { if (l.fecha === fecha && l.pdf) ids.add(l.vehId); });
  return [...ids].map(id => {
    const v = vehiculo(id) || { placa: "?", bk: "" }, l = liqDe(fecha, id);
    const trip = l && l.pdf ? tripLiq(l) : tripDia(fecha, id).map(t => ({ personaId: t.personaId, nombre: t.p.nombre, dni: t.p.dni, funcion: t.funcion }));
    const txt = [v.placa, v.bk, l && l.pdf ? l.pdf.enc.viaje + " " + l.pdf.enc.placa + " " + l.pdf.enc.conductor : "", ...trip.map(t => t.nombre + " " + (t.dni || ""))].join(" ");
    return { v, l: l && l.pdf ? l : null, trip, txt, c: l && l.pdf ? calc(l) : null };
  }).sort((a, b) => a.v.placa.localeCompare(b.v.placa));
}
function vTripulacion(m) {
  const dia = S.dias[FECHA] || {};
  const asignados = new Set(Object.values(dia).flat().map(t => t.personaId));
  const lista = S.personal.filter(p => hayQ(BUSCA_P, p.nombre + " " + p.dni));
  const vehsF = S.vehiculos.filter(v => hayQ(BUSCA_P, [v.placa, v.bk, ...tripDia(FECHA, v.id).map(t => t.p.nombre + " " + (t.p.dni || ""))].join(" ")));
  // historial
  const fechas = [...new Set([...Object.keys(S.dias).filter(d => Object.keys(S.dias[d]).length), ...Object.values(S.liqs).filter(l => l.pdf).map(l => l.fecha)])].sort().reverse();
  const hist = fechas.map(fe => ({ fe, filas: filasDia(fe).filter(r => hayQ(BUSCA_P, r.txt)) })).filter(h => h.filas.length);
  m.innerHTML = `
    <div class="card"><div class="row">
      <label class="f">Fecha<input type="date" id="trFecha" value="${FECHA}"></label>
      <label class="f grow">Buscar (nombre, DNI, placa, nombre comercial o viaje)<input id="trBusca" value="${esc(BUSCA_P)}" placeholder="Ej. 45879632, BMX-740, BK3788, Guillermo"></label>
      <button id="trLimpiar">Limpiar</button>
      <button id="trCopiar">Copiar del día anterior</button>
      <button class="danger" id="trVaciar" ${Object.keys(dia).length ? "" : "disabled"}>Vaciar día</button>
    </div>
    <p class="ayuda" style="margin:8px 0 0">Arrastra a cada persona hacia su vehículo (o usa “+ Agregar” en la tarjeta). La tripulación queda registrada para el <b>${fmtF(FECHA)}</b>.</p></div>
    ${!S.vehiculos.length || !S.personal.length ? `<div class="card m-warn">Primero registra ${!S.vehiculos.length ? "<b>vehículos</b>" : ""}${!S.vehiculos.length && !S.personal.length ? " y " : ""}${!S.personal.length ? "<b>personal</b>" : ""} en sus apartados del menú.</div>` : ""}
    <div class="dos">
      <div class="card"><h2>Personal (${lista.length}${lista.length !== S.personal.length ? " de " + S.personal.length : ""})</h2>
        <div class="chips">${lista.map(p => `<span class="chip ${asignados.has(p.id) ? "usado" : ""}" draggable="true" data-p="${p.id}" title="DNI ${esc(p.dni)}">${esc(p.nombre)} <small>${esc(p.funcion || "")}</small></span>`).join("") || `<span class="vacio">Sin resultados.</span>`}</div>
      </div>
      <div class="grid-veh">${vehsF.length ? vehsF.map(v => {
        const t = tripDia(FECHA, v.id);
        return `<div class="veh" data-vt="${v.id}" style="cursor:default">
          <div class="vh"><span>${esc(v.placa)}${v.bk ? " — " + esc(v.bk) : ""}</span><span class="tag azul">${t.length}</span></div>
          ${t.length ? `<table><thead><tr><th></th><th class="num">Función</th><th></th></tr></thead><tbody>${t.map(x => `<tr>
            <td>${esc(x.p.nombre)}${x.p.dni ? `<br><small class="ayuda">DNI ${esc(x.p.dni)}</small>` : ""}</td>
            <td class="num"><select data-fun="${v.id}|${x.personaId}" style="padding:2px 4px;font-size:11px">${FUNCIONES.concat(FUNCIONES.includes(x.funcion) ? [] : [x.funcion]).map(f => `<option ${f === x.funcion ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></td>
            <td><button class="x" data-quitar="${v.id}|${x.personaId}">✕</button></td></tr>`).join("")}</tbody></table>`
            : `<div class="sin">Suelta aquí a la tripulación</div>`}
          <div class="vf"><select data-add="${v.id}" style="width:100%;font-size:12px"><option value="">+ Agregar persona…</option>
            ${S.personal.filter(p => !asignados.has(p.id)).map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join("")}</select></div>
        </div>`; }).join("") : `<div class="card vacio">Ningún vehículo coincide con la búsqueda.</div>`}</div>
    </div>
    <h2 style="margin-top:22px">Historial de viajes por fecha</h2>
    <p class="ayuda">Haz clic en una fecha para ver todos los viajes cargados ese día, con placa, tripulación y montos.${BUSCA_P ? " Filtrado por “" + esc(BUSCA_P) + "”." : ""}</p>
    ${hist.length ? hist.map(({ fe, filas }) => {
      const ab = HIST_ABIERTO.has(fe) || (BUSCA_P && hist.length <= 3);
      let pg = 0, ds = 0, aC = 0, fav = 0, nv = 0, nc = 0;
      filas.forEach(r => { if (r.c) { nv++; pg += r.c.pagado; ds += r.c.descontado; aC += r.c.aCobrar; fav += r.c.aFavor; if (r.l.estado === "cerrada") nc++; } });
      const dsem = new Date(fe + "T12:00:00").toLocaleDateString("es-PE", { weekday: "long" });
      return `<div class="dia-row ${ab ? "on" : ""}">
        <div class="dia-h" data-hist="${fe}">
          <span class="dia-f">${ab ? "▾" : "▸"} <b>${fmtF(fe)}</b> <small>${dsem}</small></span>
          <span>${filas.length} vehículo(s)</span><span>${nv} viaje(s) cargado(s)</span><span>${nc} cerrada(s)</span>
          <span>A cobrar <b>${soles(r2(aC), false)}</b></span><span>Pagado <b class="pos">${soles(r2(pg), false)}</b></span>
          <span>Descuento <b class="neg">${soles(r2(ds), false)}</b></span>${fav ? `<span>A favor <b class="pos">${soles(r2(fav), false)}</b></span>` : ""}
        </div>
        ${ab ? `<div class="scroll"><table><thead><tr><th>Placa — Nombre</th><th>Nº viaje</th><th>Conductor (PDF)</th><th>Tripulación</th><th>Estado</th><th class="num">Neto</th><th class="num">A cobrar</th><th class="num">Pagado</th><th class="num">Descuento</th><th></th></tr></thead><tbody>
          ${filas.map(r => `<tr><td><b>${esc(r.v.placa)}</b>${r.v.bk ? " — " + esc(r.v.bk) : ""}</td>
            <td>${r.l ? esc(r.l.pdf.enc.viaje) : "—"}</td><td>${r.l ? esc(r.l.pdf.enc.conductor) : "—"}</td>
            <td style="font-size:12px">${r.trip.map(t => `${esc(t.nombre)} <small class="ayuda">(${esc(t.funcion)}${t.dni ? " · " + esc(t.dni) : ""})</small>`).join("<br>") || "—"}</td>
            <td>${estadoTag(r.l)}</td>
            <td class="num ${r.c ? cls(r.c.neto) : ""}">${r.c ? soles(r.c.neto) : "—"}</td><td class="num">${r.c ? soles(r.c.aCobrar, false) : "—"}</td>
            <td class="num pos">${r.c ? soles(r.c.pagado, false) : "—"}</td><td class="num neg">${r.c ? soles(r.c.descontado, false) : "—"}</td>
            <td>${r.l ? `<button data-ver="${r.l.id}">Ver</button>` : ""}</td></tr>`).join("")}
          </tbody></table></div>
          <div class="row" style="padding:8px 12px"><button data-irfecha="${fe}">Ir a la tripulación de este día</button></div>` : ""}
      </div>`; }).join("") : `<div class="card vacio">Aún no hay días registrados${BUSCA_P ? " que coincidan con la búsqueda" : ""}.</div>`}`;
  $("trFecha").onchange = e => { FECHA = e.target.value || hoyISO(); $("fecha").value = FECHA; render(); };
  const b = $("trBusca");
  b.oninput = () => { BUSCA_P = b.value; clearTimeout(b._t); b._t = setTimeout(() => { const pos = b.selectionStart; render(); const n = $("trBusca"); n.focus(); n.setSelectionRange(pos, pos); }, 250); };
  $("trLimpiar").onclick = () => { BUSCA_P = ""; render(); };
  m.querySelectorAll("[data-hist]").forEach(h => h.onclick = () => { const fe = h.dataset.hist; HIST_ABIERTO.has(fe) ? HIST_ABIERTO.delete(fe) : HIST_ABIERTO.add(fe); render(); });
  m.querySelectorAll("[data-ver]").forEach(x => x.onclick = () => abrirLiqId(x.dataset.ver));
  m.querySelectorAll("[data-irfecha]").forEach(x => x.onclick = () => { FECHA = x.dataset.irfecha; $("fecha").value = FECHA; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  m.querySelectorAll(".chip[data-p]").forEach(c => c.ondragstart = e => e.dataTransfer.setData("text/persona", c.dataset.p));
  m.querySelectorAll("[data-vt]").forEach(card => {
    card.ondragover = e => { if ([...e.dataTransfer.types].includes("text/persona")) { e.preventDefault(); card.classList.add("over"); } };
    card.ondragleave = () => card.classList.remove("over");
    card.ondrop = e => { e.preventDefault(); card.classList.remove("over"); asignar(card.dataset.vt, e.dataTransfer.getData("text/persona")); };
  });
  m.querySelectorAll("[data-add]").forEach(s => s.onchange = () => { if (s.value) asignar(s.dataset.add, s.value); });
  m.querySelectorAll("[data-quitar]").forEach(x => x.onclick = () => {
    const [vid, pid] = x.dataset.quitar.split("|");
    S.dias[FECHA][vid] = S.dias[FECHA][vid].filter(t => t.personaId !== pid);
    if (!S.dias[FECHA][vid].length) delete S.dias[FECHA][vid];
    guardar(); render();
  });
  m.querySelectorAll("[data-fun]").forEach(s => s.onchange = () => {
    const [vid, pid] = s.dataset.fun.split("|");
    const t = S.dias[FECHA][vid].find(t => t.personaId === pid); t.funcion = s.value; guardar();
  });
  $("trCopiar").onclick = () => {
    const prev = Object.keys(S.dias).filter(d => d < FECHA && Object.keys(S.dias[d]).length).sort().pop();
    if (!prev) return toast("No hay un día anterior con tripulación.");
    S.dias[FECHA] = JSON.parse(JSON.stringify(S.dias[prev])); guardar(); render(); toast("Tripulación copiada del " + fmtF(prev) + ".");
  };
  $("trVaciar").onclick = e => {
    const bt = e.target; if (!bt.dataset.ok) { bt.dataset.ok = 1; bt.textContent = "¿Seguro? Clic otra vez"; setTimeout(() => { if (bt.isConnected) { delete bt.dataset.ok; bt.textContent = "Vaciar día"; } }, 3000); return; }
    delete S.dias[FECHA]; guardar(); render();
  };
}
function asignar(vehId, personaId) {
  const p = persona(personaId); if (!p) return;
  const dia = S.dias[FECHA] = S.dias[FECHA] || {};
  // si ya estaba en otro vehículo ese día, se mueve
  Object.keys(dia).forEach(k => { dia[k] = dia[k].filter(t => t.personaId !== personaId); if (!dia[k].length) delete dia[k]; });
  (dia[vehId] = dia[vehId] || []).push({ personaId, funcion: p.funcion || "AUXILIAR" });
  guardar(); render();
}

      <button class="primary" id="pAdd">Agregar</button></div>
      <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Pegar lista desde Excel</summary>
        <p class="ayuda">Copia desde Excel las columnas <b>Nombre · DNI · Función</b> (en ese orden) y pégalas aquí. Si el DNI ya existe, se actualiza.</p>
        <textarea id="pPegar" placeholder="GUILLERMO ANTONIO HERNANDEZ ORTIZ&#9;45879632&#9;CHOFER"></textarea>

      ${S.personal.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(p => `<tr>
        <td><input data-ed="${p.id}|nombre" value="${esc(p.nombre)}" style="width:100%"></td>
        <td><input data-ed="${p.id}|dni" value="${esc(p.dni)}" style="width:130px"></td>
        <td><select data-ed="${p.id}|funcion">${FUNCIONES.map(f => `<option ${f === p.funcion ? "selected" : ""}>${f}</option>`).join("")}</select></td>
        <td><button class="x" data-del="${p.id}" title="Eliminar">✕</button></td></tr>`).join("")}</tbody></table>` : `<div class="vacio">Aún no hay personal.</div>`}
    </div>`;
  $("pAdd").onclick = () => {
    const n = $("pNom").value.trim(); if (!n) return toast("Escribe el nombre.");
    S.personal.push({ id: uid(), nombre: n.toUpperCase(), dni: $("pDni").value.trim(), funcion: $("pFun").value }); guardar(); render();
  };
  $("pImportar").onclick = () => {
    let n = 0;
    $("pPegar").value.split(/\r?\n/).map(r => r.split(/\t|;/).map(x => x.trim())).filter(r => r[0]).forEach(([nom, dni = "", fun = ""]) => {
      if (/^nombre/i.test(nom)) return;
      const f = FUNCIONES.find(x => sinTilde(x) === sinTilde(fun)) || (fun ? fun.toUpperCase() : "AUXILIAR");
      const ex = dni && S.personal.find(p => p.dni === dni);
      if (ex) Object.assign(ex, { nombre: nom.toUpperCase(), funcion: f }); else S.personal.push({ id: uid(), nombre: nom.toUpperCase(), dni, funcion: f });
      n++;
    });
    guardar(); render(); toast(n + " persona(s) importadas.");
  };
  m.querySelectorAll("[data-ed]").forEach(i => i.onchange = () => { const [id, k] = i.dataset.ed.split("|"); const p = persona(id); p[k] = k === "nombre" ? i.value.trim().toUpperCase() : i.value.trim(); guardar(); });
  m.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "¿Eliminar?"; setTimeout(() => { if (b.isConnected) { delete b.dataset.ok; b.textContent = "✕"; } }, 3000); return; }
    S.personal = S.personal.filter(p => p.id !== b.dataset.del);
    Object.values(S.dias).forEach(d => Object.keys(d).forEach(k => { d[k] = d[k].filter(t => t.personaId !== b.dataset.del); if (!d[k].length) delete d[k]; }));
    guardar(); render();
  });
}

        <textarea id="vPegar" placeholder="BNT-895&#9;BK3783"></textarea>
        <button id="vImportar" style="margin-top:6px">Importar</button></details>

      ${S.vehiculos.length ? `<table><thead><tr><th>Placa</th><th>Nombre comercial</th><th class="num">Liquidaciones</th><th></th></tr></thead><tbody>
      ${S.vehiculos.map(v => `<tr><td><input data-ev="${v.id}|placa" value="${esc(v.placa)}" style="width:140px"></td>
        <td><input data-ev="${v.id}|bk" value="${esc(v.bk)}"></td>

  $("vAdd").onclick = () => { if (!add($("vPla").value, $("vBk").value)) return toast("Escribe la placa."); guardar(); render(); };
  $("vImportar").onclick = () => {
    let n = 0; $("vPegar").value.split(/\r?\n/).map(r => r.split(/\t|;/)).forEach(([p, b]) => { if (p && !/^placa/i.test(p.trim()) && add(p, b)) n++; });
    guardar(); render(); toast(n + " vehículo(s) importados.");
  };
  m.querySelectorAll("[data-ev]").forEach(i => i.onchange = () => { const [id, k] = i.dataset.ev.split("|"); vehiculo(id)[k] = i.value.trim().toUpperCase(); guardar(); });
  m.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const usado = Object.values(S.liqs).some(l => l.vehId === b.dataset.del && l.pdf);
    if (usado) return toast("Tiene liquidaciones registradas: no se puede eliminar (puedes renombrarlo).");
    if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "¿Eliminar?"; setTimeout(() => { if (b.isConnected) { delete b.dataset.ok; b.textContent = "✕"; } }, 3000); return; }
    S.vehiculos = S.vehiculos.filter(v => v.id !== b.dataset.del);
    Object.values(S.dias).forEach(d => delete d[b.dataset.del]);
    guardar(); render();
  });
}

function vConfig(m) {
  m.innerHTML = `
    <div class="card"><h2>Precios de envases</h2><p class="ayuda">Se usan en las liquidaciones abiertas. Al cerrar una liquidación, se guardan los precios de ese momento.</p>
      <div class="row">
        <label class="f">Caja (S/)<input type="number" step="0.01" id="pc" value="${S.precios.caja}"></label>
        <label class="f">Botella ≥ 600 ml (S/)<input type="number" step="0.01" id="pg" value="${S.precios.grande}"></label>
        <label class="f">Botella &lt; 600 ml (S/)<input type="number" step="0.01" id="pch" value="${S.precios.chica}"></label>
      </div></div>
    <div class="card"><h2>Respaldo</h2>
      <p class="ayuda">Los datos (personal, vehículos, tripulaciones y liquidaciones) se guardan solo en este navegador. Descarga un respaldo con frecuencia; con él puedes pasar la información a otra computadora.</p>
      <div class="row"><button class="primary" id="bExp">Descargar respaldo</button><button id="bImp">Restaurar respaldo</button></div>
      <p class="ayuda" style="margin-top:10px">${S.personal.length} personas · ${S.vehiculos.length} vehículos · ${Object.values(S.liqs).filter(l => l.pdf).length} liquidaciones</p>
    </div>
    <div class="card"><h2>Borrar todo</h2><button class="danger" id="bBorrar">Borrar todos los datos</button></div>`;
  const setP = (id, k) => $(id).onchange = e => { S.precios[k] = Math.max(0, +e.target.value || 0); guardar(); toast("Precio actualizado."); };
  setP("pc", "caja"); setP("pg", "grande"); setP("pch", "chica");
  $("bExp").onclick = () => descargar(`respaldo_liquidaciones_${hoyISO()}.json`, new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }));
  $("bImp").onclick = () => $("fileJson").click();
  $("bBorrar").onclick = e => {
    const b = e.target; if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "¿Seguro? Se borrará todo. Clic otra vez"; setTimeout(() => { if (b.isConnected) { delete b.dataset.ok; b.textContent = "Borrar todos los datos"; } }, 4000); return; }
    S = { precios: { caja: 3.8, grande: 0.6, chica: 0.5 }, preciosProd: {}, personal: [], vehiculos: [], dias: {}, liqs: {} }; guardar(); render(); toast("Datos borrados.");
  };
}
$("fileJson").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.personal) || !d.liqs) throw new Error("formato");
    S = Object.assign({ precios: { caja: 3.8, grande: 0.6, chica: 0.5 }, preciosProd: {}, personal: [], vehiculos: [], dias: {}, liqs: {} }, d);
    guardar(); render(); toast("Respaldo restaurado.");
  } catch (err) { toast("El archivo no es un respaldo válido."); }
};

// =====================================================================
// Exportar Excel
// =====================================================================
const COLOR = { ROJO: { color: { argb: "FFC62828" }, bold: true }, VERDE: { color: { argb: "FF1E8E3E" }, bold: true } };
const MONEY = '#,##0.00;-#,##0.00';
function hoja(wb, nombre, cols, rows, moneyCols = [], signCol = null) {
  const ws = wb.addWorksheet(nombre, { views: [{ state: "frozen", ySplit: 1 }] });
  ws.addRow(cols);
  ws.getRow(1).eachCell(c => { c.font = { bold: true, color: { argb: "FFFFFFFF" } }; c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF3B3591" } }; c.alignment = { horizontal: "center" }; });
  rows.forEach(r => {
    const row = ws.addRow(r);
    moneyCols.forEach(i => row.getCell(i + 1).numFmt = MONEY);
    if (signCol != null && typeof r[signCol] === "number" && r[signCol] !== 0) row.getCell(signCol + 1).font = r[signCol] > 0 ? COLOR.VERDE : COLOR.ROJO;
  });
  ws.columns.forEach(col => { let w = 10; col.eachCell({ includeEmpty: false }, c => { w = Math.max(w, String(c.value ?? "").length + 2); }); col.width = Math.min(w, 45); });
  return ws;
}
async function guardarWb(wb, nombre) {
  if (typeof ExcelJS === "undefined") return toast("No se pudo cargar la librería de Excel (revisa tu internet).");
  const buf = await wb.xlsx.writeBuffer();
  descargar(nombre, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}
function filasLiq(ls) {
  return ls.map(l => { const c = calc(l), v = vehiculo(l.vehId) || {}, e = l.pdf.enc;
    return [fmtF(l.fecha), v.placa, v.bk, e.viaje, e.placa, e.conductor, e.revisor, tripLiq(l).map(t => `${t.nombre} (${t.funcion})`).join(", "),
      l.estado === "cerrada" ? "Cerrada" : "En proceso", c.bot, c.caj, c.sobr, c.falt, c.neto, c.aFavor, c.credito, c.aCobrar, c.pagado, c.descontado, c.pendiente,
      (l.ajustes || []).filter(a => a.codigo !== "COMENTARIO").map(a => `${a.codigo} ${a.cantidad} ${a.codigoMat}`).join("; "), l.comentarioCierre || ""]; });
}
const COLS_LIQ = ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Placa PDF", "Conductor PDF", "Revisor", "Tripulación", "Estado", "Botellas", "Cajas", "Sobrante S/", "Faltante S/", "Neto S/", "Sobrante a favor S/", "Saldo a favor aplicado S/", "A cobrar S/", "Pagado S/", "Descuento S/", "Pendiente S/", "Ajustes ZPD", "Comentario de cierre"];
function filasCobros(ls, tipo) {
  const out = [];
  ls.forEach(l => { const v = vehiculo(l.vehId) || {};
    (l.cobros || []).filter(c => c.tipo === tipo).forEach(c => out.push(tipo === "pago"
      ? [fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje, c.nombre, c.dni, c.medio, c.operacion || "", c.monto]
      : [fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje, c.nombre, c.dni, c.modo === "tripulacion" ? "Partes iguales (tripulación)" : c.modo === "otro" ? "Otra persona" : "Tripulante", c.monto])); });
  return out;
}
function filasDif(items) {
  return items.map(({ l, v, trip, x }) => [fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje, trip.map(t => t.nombre).join(", "), trip.map(t => t.dni).filter(Boolean).join(", "),
    x.seccion, x.codigo, x.nombre, x.conductor, x.sistema, x.difPdf ?? x.diferencia, x.ajuste || 0, x.diferencia, x.tipo || "", x.precio, x.dinero]);
}
const COLS_DIF = ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Tripulación", "DNI tripulación", "Sección", "Código", "Descripción", "Conductor (cant.)", "Sistema (cant.)", "Dif. PDF", "Ajuste ZPD", "Diferencia final", "Tipo envase", "Precio", "Dinero S/"];
function exportarReporte(ls, desde, hasta) {
  if (typeof ExcelJS === "undefined") return toast("No se pudo cargar la librería de Excel (revisa tu internet).");
  const wb = new ExcelJS.Workbook();
  // Cuadre de caja: dinero recibido por día y medio de pago
  const porDia = {};
  ls.forEach(l => {
    const c = calc(l), d = porDia[l.fecha] = porDia[l.fecha] || { medios: {}, desc: 0, saldo: 0, aCobrar: 0, pend: 0, n: 0, abiertas: 0 };
    d.n++; if (l.estado !== "cerrada") d.abiertas++;
    d.desc = r2(d.desc + c.descontado); d.saldo = r2(d.saldo + c.credito); d.aCobrar = r2(d.aCobrar + c.aCobrar); d.pend = r2(d.pend + Math.max(c.pendiente, 0));
    (l.cobros || []).filter(x => x.tipo === "pago").forEach(x => d.medios[x.medio] = r2((d.medios[x.medio] || 0) + x.monto));
  });
  const filasCaja = Object.keys(porDia).sort().map(fe => { const d = porDia[fe]; const rec = r2(MEDIOS.reduce((a, mm) => a + (d.medios[mm] || 0), 0));
    return [fmtF(fe), d.n, d.abiertas, d.aCobrar, ...MEDIOS.map(mm => d.medios[mm] || 0), rec, d.desc, d.saldo, d.pend]; });
  const tot = ["TOTAL", 0, 0, ...Array(MEDIOS.length + 5).fill(0)];
  filasCaja.forEach(r => r.forEach((v, i) => { if (i > 0) tot[i] = r2(tot[i] + v); }));
  filasCaja.push(tot);
  const wcaja = hoja(wb, "Cuadre de caja", ["Fecha", "Liquidaciones", "Sin cerrar", "A cobrar S/", ...MEDIOS.map(mm => mm + " S/"), "Total recibido S/", "Descontado S/", "Saldo a favor aplicado S/", "Pendiente S/"],
    filasCaja, [3, ...MEDIOS.map((_, i) => 4 + i), 4 + MEDIOS.length, 5 + MEDIOS.length, 6 + MEDIOS.length, 7 + MEDIOS.length]);
  wcaja.lastRow.font = { bold: true };
  wcaja.orderNo = -2;
  hoja(wb, "Liquidaciones", COLS_LIQ, filasLiq(ls), [11, 12, 13, 14, 15, 16, 17, 18, 19], 13);
  hoja(wb, "Pagos", ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Pagó", "DNI", "Medio", "Nº operación", "Monto S/"], filasCobros(ls, "pago"), [8]);
  hoja(wb, "Descuentos", ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Persona", "DNI", "Tipo", "Monto S/"], filasCobros(ls, "descuento"), [7]);
  const col = {};
  ls.forEach(l => (l.cobros || []).forEach(x => { const k = (x.dni || "") + "|" + x.nombre; const p = col[k] = col[k] || [x.nombre, x.dni, 0, 0, 0];
    if (x.tipo === "pago") p[2] = r2(p[2] + x.monto); else p[3] = r2(p[3] + x.monto); p[4] = r2(p[2] + p[3]); }));
  const filasCol = Object.values(col).sort((a, b) => a[0].localeCompare(b[0]));
  filasCol.push(["TOTAL", "", r2(filasCol.reduce((a, r) => a + r[2], 0)), r2(filasCol.reduce((a, r) => a + r[3], 0)), r2(filasCol.reduce((a, r) => a + r[4], 0))]);
  const wc = hoja(wb, "Por colaborador", ["Colaborador", "DNI", "Pagado S/", "Descontado S/", "Total S/"], filasCol, [2, 3, 4]);
  wc.lastRow.font = { bold: true };
  wc.orderNo = -1;
  const items = []; ls.forEach(l => { const v = vehiculo(l.vehId) || {}, trip = tripLiq(l); calc(l).lineas.forEach(x => items.push({ l, v, trip, x })); });
  hoja(wb, "Diferencias", COLS_DIF, filasDif(items), [15, 16], 13);
  const ajs = []; ls.forEach(l => { const v = vehiculo(l.vehId) || {}; (l.ajustes || []).forEach(a => ajs.push([fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje,
    a.codigo === "COMENTARIO" ? "Nota" : a.codigo, a.seccion, a.codigoMat, a.nombre, a.codigo === "COMENTARIO" ? "" : a.cantidad,
    a.codigo === "ZPD7" ? "Quita faltante" : a.codigo === "ZPD4" ? "Agrega faltante" : "", a.comentario || ""])); });
  hoja(wb, "Ajustes y comentarios", ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Código", "Sección", "Material", "Descripción", "Cantidad", "Efecto", "Comentario"], ajs);
  guardarWb(wb, `cuadre_caja_${desde}${hasta !== desde ? "_al_" + hasta : ""}.xlsx`);
}
function exportarTraza(f, cobros) {
  const wb = new ExcelJS.Workbook();
  hoja(wb, "Faltantes y sobrantes", COLS_DIF, filasDif(f), [15, 16], 13);
  hoja(wb, "Pagos y descuentos", ["Fecha", "Placa", "Nombre comercial", "Persona", "DNI", "Tipo", "Detalle", "Monto S/"],
    cobros.map(({ l, v, c }) => [fmtF(l.fecha), v.placa, v.bk, c.nombre, c.dni, c.tipo === "pago" ? "Pago" : "Descuento", c.tipo === "pago" ? c.medio : (c.modo === "tripulacion" ? "Partes iguales" : ""), c.monto]), [7]);
  guardarWb(wb, `trazabilidad_${hoyISO()}.xlsx`);
}

// En Claude usa su función de descargas; en cualquier otro sitio (GitHub Pages, tu PC) descarga normal.
async function descargar(nombre, blob) {
  if (window.claude && typeof window.claude.use === "function") {
    try { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename: nombre, data: blob }); toast("Archivo descargado."); return; } }
    catch (e) { if (e && e.code === "declined") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Archivo descargado.");
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && LIQ_ABIERTA) cerrarPanel(); });
$("panel").addEventListener("click", e => { if (e.target.id === "panel") cerrarPanel(); });
ir("liquidar");
