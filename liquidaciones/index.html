<script>
// ===== Lector de "Acuerdo de liquidación de inventario" (independiente de la versión de pdf.js) =====
const SECCIONES = { "productos": "Productos", "bloqueados": "Bloqueados", "vacíos": "Vacíos", "vacios": "Vacíos", "activos": "Activos" };
const RE_RATIO = /^(\d+)\/(\d+)$/, RE_NUM = /^\d+$/, RE_DEN = /^\/(\d+)$/, RE_FECHA = /^\d{2}\/\d{2}\/\d{4}$/;

// items: [{str, x, top}] (top = distancia desde arriba). Une "3624" + "/1044" partidos en dos renglones.
function unirRatiosPartidos(items) {
  const usados = new Set(), nuevos = [];
  items.forEach((d, i) => {
    if (!RE_DEN.test(d.str)) return;
    let mejor = -1;
    items.forEach((n, j) => {
      if (usados.has(j) || !RE_NUM.test(n.str)) return;
      const dy = d.top - n.top;
      if (Math.abs(n.x - d.x) < 8 && dy > 0 && dy < 20 && (mejor < 0 || dy < d.top - items[mejor].top)) mejor = j;
    });
    if (mejor >= 0) {
      const n = items[mejor];
      usados.add(i); usados.add(mejor);
      nuevos.push({ str: n.str + d.str, x: n.x, top: (n.top + d.top) / 2 });
    }
  });
  return items.filter((_, k) => !usados.has(k)).concat(nuevos);
}

function agruparFilas(items, tol = 4) {
  const filas = [];
  [...items].sort((a, b) => a.top - b.top || a.x - b.x).forEach(it => {
    const f = filas[filas.length - 1];
    if (f && Math.abs(f.top - it.top) <= tol) f.items.push(it);
    else filas.push({ top: it.top, items: [it] });
  });
  filas.forEach(f => {
    f.items.sort((a, b) => a.x - b.x);
    f.tokens = []; // cada token conserva la x de su item
    f.items.forEach(it => it.str.split(/\s+/).filter(Boolean).forEach(t => f.tokens.push({ t, x: it.x })));
    f.texto = f.tokens.map(o => o.t).join(" ");
  });
  return filas;
}

// paginas: [{width, items:[{str,x,top}]}]
function parsearLiquidacion(paginas) {
  const enc = { conductor: "", viaje: "", placa: "", fechaEntrega: "", fechaRevision: "", revisor: "" };
  const lineas = [];
  let seccion = null;
  for (const pag of paginas) {
    const items = unirRatiosPartidos(pag.items.filter(i => i.str && i.str.trim()).map(i => ({ ...i, str: i.str.trim() })));
    const filas = agruparFilas(items);
    const mitad = pag.width / 2;
    filas.forEach((fila, k) => {
      const t = fila.texto, toks = fila.tokens.map(o => o.t);
      if (t.startsWith("Nombre del conductor") && filas[k + 1]) {
        if (!enc.viaje) {
          const vals = filas[k + 1].tokens.map(o => o.t);
          const fechas = vals.filter(v => RE_FECHA.test(v)), otros = vals.filter(v => !RE_FECHA.test(v));
          if (otros.length >= 3) {
            [enc.conductor, enc.viaje, enc.placa] = otros;
            enc.fechaEntrega = fechas[0] || ""; enc.fechaRevision = fechas[1] || "";
          }
        }
        return;
      }
      if (t.includes("Firma del revisor") && filas[k + 1] && !enc.revisor) {
        enc.revisor = filas[k + 1].tokens.filter(o => o.x < mitad).map(o => o.t).join(" ");
        return;
      }
      const primera = (toks[0] || "").toLowerCase();
      if (SECCIONES[primera] && /inconsistencia/i.test(t)) { seccion = SECCIONES[primera]; return; }   // "1 Inconsistencia" o "2 Inconsistencias"
      if (!seccion) return;
      const iR = toks.findIndex(x => RE_RATIO.test(x));
      if (iR < 2) return;
      const codigo = toks[iR - 1].replace(/^#/, "").replace(/^0+(?=\d)/, "");   // "#000000000000014259" → "14259"
      if (!RE_NUM.test(codigo)) return;
      const [, x, y] = toks[iR].match(RE_RATIO);
      lineas.push({ seccion, codigo, nombre: toks.slice(0, iR - 1).join(" "),
        conductor: +x, sistema: +y, diferencia: (+x) - (+y) });
    });
  }
  return { enc, lineas };
}

// Lee un PDF (ArrayBuffer) con pdf.js y devuelve {enc, lineas}
async function leerPdf(pdfjsLib, buffer) {
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const paginas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    paginas.push({ width: vp.width, items: tc.items.map(it => ({ str: it.str, x: it.transform[4], top: vp.height - it.transform[5] })) });
  }
  return parsearLiquidacion(paginas);
}


// ===== Lector de la hoja de tripulación (imagen / PDF / Excel) =====
// Recibe palabras con posición {t, x0, x1, yc, h} y arma los bloques: placa, BK y tripulantes con su cargo.
const _st = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const RE_PLACA_T = /^(?:[A-Z]{2})?(?=[A-Z0-9]{0,2}[A-Z])[A-Z0-9]{3}-?\d{3}$/;
const RE_FECHA_T = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/;
function distEd(a, b) {   // distancia de edición (para tolerar errores de lectura: "Repario", "Chafer")
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const ROLES_T = [["CHOFER", ["chofer", "conductor", "piloto"]], ["REPARTO", ["reparto", "repartidor"]], ["AUXILIAR APOYO", ["apoyo"]], ["AUXILIAR", ["auxiliares", "auxiliar"]]];
function rolTrip(t) {
  const s = _st(t).replace(/[^a-z]/g, "");
  if (s.length < 3) return null;

}

async function leerArchivo(f) {
  const { enc, lineas } = await leerPdf(pdfjsLib, await f.arrayBuffer());
  if (!enc.viaje || !lineas.length) throw new Error('no parece un "Acuerdo de liquidación de inventario"');
  const m = String(enc.viaje).trim().match(/^R(\d+)[-_ ]?(.+)$/i);
  return { archivo: f.name, enc, lineas, base: m ? m[2] : enc.viaje.trim(), rep: m ? +m[1] : 0 };
}

// asigna un PDF leído a la liquidación (fecha, vehículo). Devuelve [clase, mensaje]
function asignarPdf(pdf, fecha, vehId, n = 1) {
  const v = vehiculo(vehId);
  const otra = Object.values(S.liqs).find(l => l.pdf && l.pdf.base === pdf.base && !(l.fecha === fecha && l.vehId === vehId && nv(l) === n));
  if (otra) {
    const vo = vehiculo(otra.vehId);
    if (otra.pdf.rep >= pdf.rep) return ["m-err", `${pdf.archivo}: el viaje ${pdf.base} ya está liquidado en ${vo ? vo.placa : "otro vehículo"} (${fmtF(otra.fecha)}${etqViaje(otra)}).`];
    if (otra.estado === "cerrada") return ["m-err", `${pdf.archivo}: es el reproceso R${pdf.rep} del viaje ${pdf.base}, pero esa liquidación (${fmtF(otra.fecha)}) ya está cerrada. Reábrela primero.`];
    delete S.liqs[otra.id];
  }
  let l = liqDe(fecha, vehId, n);
  if (l && l.estado === "cerrada") return ["m-err", `${pdf.archivo}: la liquidación de ${v.placa} (Viaje ${n}) ya está cerrada. Reábrela para cambiar el PDF.`];
  if (l && l.pdf && l.pdf.base === pdf.base && l.pdf.rep > pdf.rep) return ["m-warn", `${pdf.archivo}: ya está cargado el reproceso R${l.pdf.rep}, que es más reciente. Omitido.`];
  if (!l) { l = { id: uid(), creado: new Date().toISOString(), fecha, vehId, nviaje: n, cobros: [], estado: "abierta", incluirProductos: false, preciosProd: {} }; S.liqs[l.id] = l; }
  l.pdf = pdf; delete l.temporal;
  const aviso = placaCoincide(pdf.enc.placa, v.placa) ? "" : ` ⚠ La placa del PDF (${pdf.enc.placa}) no coincide con ${v.placa}.`;
  return [aviso ? "m-warn" : "m-ok", `${pdf.archivo}: viaje ${pdf.enc.viaje} cargado en ${v.placa}${v.bk ? " — " + v.bk : ""} como Viaje ${n}.${aviso}`];
}

function resumenLiq(l) {
  const c = calc(l);
  const cob = (l.cobros || []).filter(x => x.rubro !== "otro"), sum = t => r2(cob.filter(x => x.tipo === t).reduce((a, x) => a + x.monto, 0));
  const pg = sum("pago"), ds = sum("descuento"), cs = sum("consumo"), partes = [];
  if (pg && ds) partes.push(`<span class="tag warn">Pagado parcial</span> <b class="pos">${soles(pg, false)}</b> · Descuento <b class="neg">${soles(ds, false)}</b>`);
  else if (pg) partes.push(`<span class="tag pos">Pagado</span> <b class="pos">${soles(pg, false)}</b>`);
  else if (ds) partes.push(`<span class="tag neg">Descuento</span> <b class="neg">${soles(ds, false)}</b>`);
  if (cs) partes.push(`Consumo interno <b>${soles(cs, false)}</b>`);
  if (c.credito) partes.push(`Neteado <b class="pos">${soles(c.credito, false)}</b>`);
  if (c.aCobrar && c.pendiente > 0) partes.push(`${pg || ds || cs ? "Falta" : "Pendiente"} <b class="neg">${soles(c.pendiente, false)}</b>`);
  return partes.length ? partes.join(" · ")
    : c.aFavor ? `Sobrante a favor <b class="pos">${soles(c.aFavor, false)}</b>` : `Neto <b>${soles(0, false)}</b> · sin cobro`;
}

async function cargarPdfs(files, vehId, abrir, nFijo) {
  MSGS = []; let ultimo = null;
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) { MSGS.push(["m-warn", `${f.name}: no es PDF, omitido.`]); continue; }
    try {
      const pdf = await leerArchivo(f);
      let destino = vehId;
      if (!destino) {
        const v = S.vehiculos.find(v => placaCoincide(v.placa, pdf.enc.placa));
        if (v) destino = v.id;
        else {   // placa nueva: se registra y se agrega a este día para poder liquidarla
          const nuevo = { id: uid(), placa: String(pdf.enc.placa).toUpperCase(), bk: "" };
          S.vehiculos.push(nuevo); destino = nuevo.id;
          MSGS.push(["m-warn", `${f.name}: la placa ${pdf.enc.placa} no estaba registrada; se creó el vehículo. Asígnale su BK y tripulación en Tripulación del día.`]);
        }
      }
      if (!diaCerrado(FECHA) && (S.dias[FECHA] === undefined || S.dias[FECHA][destino] === undefined)) {   // el vehículo liquidado figura en la tripulación del día
        (S.dias[FECHA] = S.dias[FECHA] || {})[destino] = (S.dias[FECHA] || {})[destino] || [];
      }
      let n = nFijo;
      if (!n) {
        const ls = liqsDe(FECHA, destino), conPdf = ls.filter(l => l.pdf);
        const mismo = conPdf.find(l => l.pdf.base === pdf.base);          // reproceso del mismo viaje
        if (mismo) n = nv(mismo);
        else if (!conPdf.length) n = ls.length ? nv(ls[0]) : 1;
        else { n = await elegirViaje(vehiculo(destino), pdf, FECHA); if (!n) { MSGS.push(["m-warn", `${f.name}: carga cancelada.`]); continue; } }
      }
      MSGS.push(asignarPdf(pdf, FECHA, destino, n));
      ultimo = liqDe(FECHA, destino, n);
    } catch (err) { console.error(err); MSGS.push(["m-err", `${f.name}: no se pudo leer (${err.message || err}).`]); }
  }
  guardar();
  if (abrir && vehId) { const l = ultimo || liqDe(FECHA, vehId, nFijo || 1); if (l) { LIQ_ABIERTA = l.id; } toastMsgs(); render(); pintarPanel(); }
  else render();
}

// recuadro final: totalizado de vacíos por tipo de envase y precio (sobrante, faltante, neto y dinero)
function gruposVac(lineas, P) {
  const ls = lineas.filter(x => x.seccion === "Vacíos" && x.diferencia !== 0);
  const G = [
    { k: "BG", t: "Total botellas 600 ml o más", p: P.grande, f: x => x.tipo.startsWith("Botella") && x.precio === P.grande },
    { k: "BC", t: "Total botellas 599 ml o menos", p: P.chica, f: x => x.tipo.startsWith("Botella") && x.precio === P.chica },
    { k: "CJ", t: "Total cajas", p: P.caja, f: x => x.tipo === "Caja" },
    { k: "SP", t: "Sin precio", p: null, f: x => x.precio == null }
  ];
  const usados = new Set();
  const filas = G.map(g => {
    const xs = ls.filter(x => !usados.has(x) && g.f(x)); xs.forEach(x => usados.add(x));
    const sob = xs.filter(x => x.diferencia > 0).reduce((a, x) => a + x.diferencia, 0), fal = xs.filter(x => x.diferencia < 0).reduce((a, x) => a + x.diferencia, 0);
    const din = xs.reduce((a, x) => a + (x.dinero || 0), 0);
    return { ...g, n: xs.length, sob, fal, neto: sob + fal, din: r2(din) };
  }).filter(g => g.n);
  return { ls, filas };
}
function totalesVacios(c, l) {

function tablaSeccion(nombre, existe, lineas, modo, l) {

      ${prod ? `<td class="num">${editable && l.editarFactor ? `<input class="precio" type="number" step="1" min="1" data-fac="${esc(x.codigo)}" value="${x.factor}" title="Ej. six pack = 6">`

// guía rápida de la liquidación: qué revisar y qué falta, en 4 pasos (cada paso lleva a su sección)
function guiaLiq(l, c, trip) {
  const cerrada = l.estado === "cerrada", nAj = (l.ajustes || []).filter(a => a.codigo !== "COMENTARIO").length;
  const sv = c.vac.neto, sp = c.liq.neto, vig = !cerrada && c.rub.vac.pend > 0 ? saldosVigentes(l, trip) : [];
  const dif = `Vacíos: <b class="${cls(sv)}">${sv > 0 ? "sobra " + soles(sv, false) : sv < 0 ? "falta " + soles(-sv, false) : "sin diferencia"}</b><br>
    Productos${c.blo.neto ? " + bloqueados" : ""}: ${l.incluirProductos || c.blo.neto ? `<b class="${cls(sp)}">${sp > 0 ? "sobra " + soles(sp, false) : sp < 0 ? "falta " + soles(-sp, false) : "sin diferencia"}</b>` : `<span class="ayuda" style="margin:0">no se cobran</span>`}`;
  const cobro = cerrada ? `✔ Cerrada · cubierto ${soles(c.cubierto + c.credito, false)}`
    : c.pendiente > 0 ? `Falta cubrir <b class="neg">${soles(c.pendiente, false)}</b>${["vac", "liq"].filter(k => c.rub[k].pend > 0).map(k => `<br>${RUBROS[k]}: ${soles(c.rub[k].pend, false)}`).join("")}`
    : c.aCobrar > 0 || c.cubierto ? `✔ Todo cubierto: ya puedes cerrar` : `Nada que cobrar: ya puedes cerrar`;
  return `<div class="guia">
    <a href="#" data-ir="secVac" class="info"><b class="t">① Diferencias</b>${dif}</a>
    <a href="#" data-ir="secAj" class="${nAj ? "ok" : "info"}"><b class="t">② Ajustes ZPD / correo</b>${nAj ? `${nAj} ajuste(s) registrados` : "Opcional: ZPD7 quita faltante, ZPD4 lo agrega"}</a>
    <a href="#" data-ir="secCobro" class="${vig.length ? "pend" : "info"}"><b class="t">③ Neteo (saldo a favor)</b>${cerrada ? `${c.credito ? "Usado " + soles(c.credito, false) : "No se usó"}` : c.credito ? `Usado ${soles(c.credito, false)}` : vig.length ? `Hay saldo disponible: ${vig.map(f => fmtF(f.fecha) + " · " + soles(f.saldo, false)).join(", ")}` : "Sin saldo vigente de la tripulación"}</a>
    <a href="#" data-ir="secCobro" class="${cerrada || !(c.pendiente > 0) ? "ok" : "pend"}"><b class="t">④ Pago / descuento y cierre</b>${cobro}</a>
  </div>`;
}

function seccionAjustes(l) {
  const cerrada = l.estado === "cerrada";
  const aj = l.ajustes || [];
  const efecto = a => a.codigo === "ZPD7" ? `Quita faltante (+${a.cantidad})` : a.codigo === "ZPD4" ? `Agrega faltante (−${a.cantidad})`
    : a.codigo === "CORREO" ? `Regularizar por correo ${a.estado === "regularizado" ? `<span class="tag pos">Regularizado</span>` : `<span class="tag warn">Pendiente</span>`}` : "Comentario";
  return `
    <h3>Ajustes y comentarios (ZPD7 / ZPD4) ${aj.length ? `<span class="tag azul">${aj.length}</span>` : ""}</h3>

function correoPorDescuento(l, monto, nombre) {

    fecha: new Date().toISOString(), cantidad: 0, mat: "", seccion: "", codigoMat: "", nombre: "", descuento: { monto, nombre } });
}
function textoCorreo(l, a) {
  const v = vehiculo(l.vehId) || {}, e = l.pdf ? l.pdf.enc : {}, trip = tripLiq(l);
  const asunto = `Regularización por correo – ${v.placa || e.placa}${v.bk ? " " + v.bk : ""} – Viaje ${e.viaje || ""} – ${e.fechaEntrega || fmtF(l.fecha)}`;
  const L = [
    "Buen día,", "",
    "Se solicita regularizar por correo la siguiente diferencia de la liquidación de inventario:", "",
    `• Fecha de entrega: ${e.fechaEntrega || fmtF(l.fecha)}`,
    `• Placa / Nombre comercial: ${v.placa || e.placa}${v.bk ? " / " + v.bk : ""}${etqViaje(l)}`,
    `• Nº de viaje: ${e.viaje || ""}`,
    `• Conductor: ${e.conductor || ""}`,
    trip.length ? `• Tripulación: ${trip.map(t => `${t.nombre} (${t.funcion})`).join(", ")}` : null,
    a.mat ? `• Material: ${a.codigoMat} – ${a.nombre} (${a.seccion})` : null,
    a.mat ? `• Cantidad a regularizar: ${a.cantidad} (diferencia en el PDF: ${und(a.difPdf ?? 0)})` : null,
    a.descuento ? `• Descuento aplicado: ${soles(a.descuento.monto, false)} a ${a.descuento.nombre}` : null,
    a.comentario && !a.descuento ? `• Comentario: ${a.comentario}` : null,
    `• Revisor: ${e.revisor || ""}`, "",
    "Quedo atento a la confirmación.", "",
    "Saludos."
  ];
  return { asunto, cuerpo: L.filter(x => x !== null).join("\n") };
}
function modalCorreo(l, a) {
  const { asunto, cuerpo } = textoCorreo(l, a), para = S.correoRegularizacion || "";
  const mailto = `mailto:${encodeURIComponent(para).replace(/%40/g, "@")}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
  const el = $("elige");

  ["mPara", "mAsunto", "mCuerpo"].forEach(id => $(id).oninput = actualizar);

  $("mCerrar").onclick = () => { el.classList.remove("on"); el.innerHTML = ""; };

  $("mAbrir").onclick = () => { a.enviadoEn = new Date().toISOString(); guardar(); };

function enlazarAjustes(l) {
  const h = $("hoja");
  h.querySelectorAll("[data-delaj]").forEach(b => b.onclick = () => { l.ajustes = (l.ajustes || []).filter(a => a.id !== b.dataset.delaj); guardar(); pintarPanel(); render(); });
  h.querySelectorAll("[data-mail]").forEach(b => b.onclick = () => { const a = (l.ajustes || []).find(x => x.id === b.dataset.mail); if (a) modalCorreo(l, a); });
  h.querySelectorAll("[data-regul]").forEach(b => b.onclick = () => {
    const a = (l.ajustes || []).find(x => x.id === b.dataset.regul); if (!a) return;
    if (a.estado === "regularizado") { a.estado = "pendiente"; delete a.regularizadoEn; } else { a.estado = "regularizado"; a.regularizadoEn = new Date().toISOString(); }
    guardar(); pintarPanel(); render();
  });
  const cod = $("ajCod"); if (!cod) return;

  cod.onchange = toggle; toggle();
  // buscador: primero las líneas del PDF, luego todo el catálogo de productos
  let SEL = null;
  const cands = () => {
    const pdf = lineasLiq(l).map(x => ({ seccion: x.seccion, codigo: String(x.codigo), nombre: x.nombre, dif: x.diferencia, enPdf: !x.manual }));
    const ya = new Set(pdf.map(x => x.seccion + "|" + x.codigo));
    const cat = Object.values(S.catalogo || {}).filter(p => !ya.has("Productos|" + p.sku) && !(p.alias || []).some(a => ya.has("Productos|" + a)))
      .map(p => ({ seccion: "Productos", codigo: p.sku, nombre: p.nombre, desc: p.descripcion, enPdf: false }));
    return pdf.sort((a, b) => (b.dif !== 0) - (a.dif !== 0)).concat(cat.sort((a, b) => a.codigo.localeCompare(b.codigo, "es", { numeric: true })));
  };
  const etq = x => { const cp = x.seccion === "Productos" ? catProd(x.codigo) : null;
    return `${esc(x.seccion)} · <b>${esc(x.codigo)}</b> — ${esc(cp && cp.nombre ? cp.nombre : x.nombre)}${x.enPdf ? ` <small class="ayuda">(PDF ${und(x.dif)})</small>` : ` <small class="ayuda">(catálogo${x.desc ? " · " + esc(x.desc) : ""})</small>`}`; };
  const buscar = () => {
    const q = $("ajBus").value.trim(), C = cands();

    $("ajRes").innerHTML = r.map((x, i) => `<div data-i="${i}">${etq(x)}</div>`).join("") || (q ? `<div style="cursor:default" class="ayuda">Sin resultados. Agrégalo primero en 🏷️ Productos.</div>` : "");
    $("ajRes").querySelectorAll("[data-i]").forEach(d => d.onclick = () => { SEL = r[+d.dataset.i]; $("ajSelTxt").innerHTML = `Seleccionado: ${etq(SEL)}`; $("ajRes").innerHTML = ""; $("ajBus").value = ""; });
  };
  $("ajBus").oninput = buscar; $("ajBus").onfocus = buscar;

    const err = t => $("ajErr").textContent = t;
    const codigo = cod.value, com = $("ajCom").value.trim();
    if (!codigo) return err("Elige una opción: ZPD7, ZPD4, Enviar correo o Solo comentario.");
    const x = SEL;
    const a = { id: uid(), codigo, comentario: com, fecha: new Date().toISOString(), cantidad: 0, mat: "", seccion: "", codigoMat: "", nombre: "" };
    if (codigo === "COMENTARIO") {
      if (!com) return err("Escribe el comentario.");
      if (x) Object.assign(a, { mat: x.seccion + "|" + x.codigo, seccion: x.seccion, codigoMat: x.codigo, nombre: x.nombre });

function saldosDeFecha(l, fecha, trip) {
  const keys = new Set(trip.map(pkey));
  const todos = Object.values(libro().fuentes).filter(f => f.rubro === "vac" && f.fecha === fecha && !(f.l && f.l.id === l.id));
  return { mios: todos.filter(f => keys.has(f.owner.key)), otros: todos.filter(f => !keys.has(f.owner.key)) };
}
function saldosVigentes(l, trip) {    // atajo: saldos de esta tripulación dentro del plazo

  const vig = mios.filter(f => l.fecha <= f.vence);

  const usosTxt = f => f.usos.length ? f.usos.map(u => { const v = vehiculo(u.l.vehId) || {}; return `${soles(u.monto, false)} en ${esc(v.placa || "")} — Viaje ${nv(u.l)} (${fmtF(u.l.fecha)}${u.l.estado === "cerrada" ? "" : ", en proceso"})`; }).join(" · ") : "sin usos";

    ${disp.map(x => `<label style="display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:13.5px;cursor:pointer"><input type="radio" name="nSrc" value="${esc(x.id)}" ${x.id === f.id ? "checked" : ""}>

let INV = { tab: "vac", modoVac: "precio", desde: null, hasta: null, q: "", seccion: "Productos", tipo: "f", estado: "", abierto: new Set() };
// grupos de vacíos que se compensan entre sí: misma clase de envase y medida (botellas 620/630/650 ml, cajas ×12 de esas botellas, etc.)
function grupoVacio(nombre) {
  const e = infoEnvase(nombre, S.precios), n = String(nombre).toUpperCase();
  if (INV.modoVac === "precio") {   // igual que la liquidación: se compensan los envases que valen lo mismo
    if (e.tipo === "Caja") return { clave: "P|CAJA", nombre: `Cajas (S/ ${S.precios.caja.toFixed(2)})`, clase: "Caja" };
    if (e.tipo.startsWith("Botella") && e.precio != null)
      return e.precio === S.precios.grande ? { clave: "P|BG", nombre: `Botellas de 600 ml o más (S/ ${S.precios.grande.toFixed(2)})`, clase: "Botella" }
        : { clave: "P|BC", nombre: `Botellas de 599 ml o menos (S/ ${S.precios.chica.toFixed(2)})`, clase: "Botella" };
  }
  const nums = (n.match(/\d{3,4}/g) || []).map(Number).filter(x => x >= 150 && x <= 3000);
  const ml = e.tipo.startsWith("Botella") ? (+e.tipo.replace(/[^\d.]/g, "") || nums[0]) : nums[0];
  const banda = !ml ? "" : ml < 400 ? "300–355 ml" : ml < 600 ? `${ml} ml` : ml < 700 ? "600–650 ml" : (ml >= 900 && ml <= 1200) ? "1 litro (1000–1100 ml)" : `${ml} ml`;
  if (e.tipo === "Caja") { const pk = (n.match(/X\s*(\d{1,2})\s*BT/) || [])[1]; return { clave: "CAJA|" + banda + "|" + (pk || ""), nombre: `Cajas${banda ? " para " + banda : ""}${pk ? " × " + pk : ""}`, clase: "Caja" }; }

}
function materialesInventario(secciones) {
  const mats = {};

        const txt = [x.codigo, x.nombre, v.placa, v.bk, l.pdf.enc.viaje, ...trip.map(t => t.nombre + " " + (t.dni || ""))].join(" ");
        if (!hayQ(INV.q, txt)) return;
        const k = x.seccion + "|" + x.codigo;
        const fac = x.seccion === "Productos" ? factorProd(l, x) : 1;
        const precio = x.seccion === "Productos" ? precioProdLiq(l, x.codigo) : x.precio;
        const valor = x.dinero != null ? x.dinero : precio != null ? r2(x.diferencia * fac * precio) : null;
        const M = mats[k] = mats[k] || { seccion: x.seccion, codigo: x.codigo, nombre: (x.seccion === "Productos" && (catProd(x.codigo) || {}).nombre) || x.nombre, tipo: x.tipo, sob: 0, fal: 0, uSob: 0, uFal: 0, valor: 0, sinValor: 0, movs: [] };
        if (x.diferencia > 0) { M.sob += x.diferencia; M.uSob += x.diferencia * fac; } else { M.fal += x.diferencia; M.uFal += x.diferencia * fac; }
        if (valor != null) M.valor = r2(M.valor + valor); else M.sinValor++;
        M.movs.push({ l, v, trip, x, fac, valor });

    });

// lo que ya se cobró (pagos + descuentos + saldo a favor/neteo) por vacíos o por productos en las liquidaciones del rango
function cobradoInventario(rubro) {
  let cob = 0, pend = 0;
  Object.values(S.liqs).filter(l => l.pdf && l.fecha >= INV.desde && l.fecha <= INV.hasta && (!INV.estado || (INV.estado === "c" ? l.estado === "cerrada" : l.estado !== "cerrada")))
    .forEach(l => {
      const c = calc(l), dv = Math.max(0, -c.vac.neto), dl = Math.max(0, -c.liq.neto);
      const sinRubro = (l.cobros || []).filter(x => !x.rubro).reduce((a, x) => a + x.monto, 0);
      const parte = dv + dl ? (rubro === "vac" ? dv : dl) / (dv + dl) : (rubro === "vac" ? 1 : 0);    // pagos antiguos sin rubro: se reparten
      const saldo = rubro === "vac" ? Math.min(c.credito, dv) : Math.min(Math.max(0, c.credito - dv), dl);
      cob += c.rub[rubro].cubierto + sinRubro * parte + saldo;

function indiceColab() {
  const idx = {};

  S.personal.forEach(p => get({ personaId: p.id, nombre: p.nombre, dni: p.dni }));
  const L = libro();
  Object.values(S.liqs).filter(l => l.pdf).forEach(l => {
    const v = vehiculo(l.vehId) || {}, c = calc(l);
    tripLiq(l).forEach(t => get(t).ev.push({ fecha: l.fecha, l, v, tipo: "Liquidación",
      det: `${t.funcion} · viaje ${l.pdf.enc.viaje}${etqViaje(l)} · ${l.estado === "cerrada" ? "cerrada" : "en proceso"}${(l.ajustes || []).length ? ` · ${l.ajustes.length} ajuste(s) ZPD/nota` : ""}${l.comentarioCierre ? ` · “${l.comentarioCierre}”` : ""}`, monto: c.neto, nota: "Neto del vehículo" }));
    (l.cobros || []).filter(x => x.tipo !== "consumo").forEach(x => get(x).ev.push({ fecha: l.fecha, l, v, tipo: x.tipo === "pago" ? "Pago" : "Descuento",
      det: x.tipo === "pago" ? `${x.medio}${x.operacion ? " · Op. " + x.operacion : ""}${x.recibe ? " · Recibió: " + x.recibe : ""}` : (x.modo === "tripulacion" ? "Partes iguales con la tripulación" : "Descuento directo"),
      monto: x.tipo === "pago" ? x.monto : -x.monto }));
  });
  Object.values(L.fuentes).forEach(f => {
    const p = get({ nombre: f.owner.nombre, dni: f.owner.dni }, f.owner.key), v = (f.l && vehiculo(f.l.vehId)) || {};
    p.ev.push({ fecha: f.fecha, l: f.l, v, tipo: "Saldo a favor generado", det: f.manual
      ? `Neteo manual (${f.manual.items.map(it => it.cantidad + " " + it.tipo).join(", ")})${f.manual.comentario ? " · " + f.manual.comentario : ""} · vence ${fmtF(f.vence)} · ${f.estado}`

    f.usos.forEach(u => p.ev.push({ fecha: u.l.fecha, l: u.l, v: vehiculo(u.l.vehId) || {}, tipo: "Saldo a favor aplicado", det: `Cubrió faltante (saldo del ${fmtF(f.fecha)})`, monto: -u.monto }));

  });

  return idx;
}

      ${lista.map(({ p, r }) => `<tr><td><b>${esc(p.nombre)}</b></td><td>${esc(p.dni)}</td><td class="num">${r.liqs}</td>
        <td class="num pos">${soles(r.pagado, false)}</td><td class="num neg">${soles(r.descontado, false)}</td><td class="num pos">${r.vigente ? soles(r.vigente, false) : "—"}</td>
        <td><button data-selc="${esc(p.key)}">Ver historial</button></td></tr>`).join("")}</tbody></table>` : `<div class="vacio">No hay colaboradores que coincidan.</div>`}</div>`;

    m.innerHTML = filtros + `
      <div class="card" style="padding:12px 16px"><h2 style="margin:0">${esc(sel.nombre)}</h2><span class="ayuda">${sel.dni ? "DNI " + esc(sel.dni) : "Sin DNI registrado"}</span></div>
      <div class="kpis">
        <div class="kpi"><span>Liquidaciones</span><b>${r.liqs}</b></div>
        <div class="kpi"><span>Pagado</span><b class="pos">${soles(r.pagado, false)}</b></div>
        <div class="kpi"><span>Descontado</span><b class="neg">${soles(r.descontado, false)}</b></div>

        <div class="kpi"><span>Saldo aplicado</span><b>${soles(r.aplicado, false)}</b></div>
        <div class="kpi"><span>Saldo vigente</span><b class="pos">${soles(r.vigente, false)}</b></div>
        <div class="kpi"><span>Saldo vencido</span><b>${soles(r.vencido, false)}</b></div>
      </div>

        ${r.ev.map(e => `<tr><td>${fmtF(e.fecha)}</td><td><b>${esc(e.v.placa)}</b>${e.v.bk ? " — " + esc(e.v.bk) : ""}</td>
          <td><span class="tag ${TIPO_TAG[e.tipo]}">${e.tipo}</span></td><td style="font-size:12.5px">${esc(e.det)}${e.nota ? ` <small class="ayuda">(${e.nota})</small>` : ""}</td>
          <td class="num ${cls(e.monto)}">${soles(e.monto)}</td><td>${e.l ? `<button data-ver="${e.l.id}">Ver</button>` : ""}</td></tr>`).join("")}
        </tbody></table>` : `<div class="vacio">Sin movimientos en este rango.</div>`}</div>`;
    $("cVolver").onclick = () => { TC.sel = null; render(); };

      hoja(wb, "Historial", ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Movimiento", "Detalle", "Monto S/"],
        r.ev.map(e => [fmtF(e.fecha), e.v.placa, e.v.bk, e.l && e.l.pdf ? e.l.pdf.enc.viaje : "", e.tipo, e.det, e.monto]), [6], 6);
      hoja(wb, "Resumen", ["Colaborador", "DNI", "Liquidaciones", "Pagado S/", "Descontado S/", "Saldo generado S/", "Saldo aplicado S/", "Saldo vigente S/", "Saldo vencido S/"],
        [[sel.nombre, sel.dni, r.liqs, r.pagado, r.descontado, r.generado, r.aplicado, r.vigente, r.vencido]], [3, 4, 5, 6, 7, 8]);
      guardarWb(wb, `trazabilidad_${sinTilde(sel.nombre).replace(/[^a-z0-9]+/g, "_")}.xlsx`);
    };
  }
  const q = $("cQ");
  if (q) q.oninput = () => { TC.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { const pos = q.selectionStart; render(); const n = $("cQ"); n.focus(); n.setSelectionRange(pos, pos); }, 250); };
  $("tD").onchange = e => { TZ.desde = e.target.value; render(); };
  $("tH").onchange = e => { TZ.hasta = e.target.value; render(); };
  m.querySelectorAll("[data-selc]").forEach(b => b.onclick = () => { TC.sel = b.dataset.selc; render(); window.scrollTo({ top: 0 }); });
  m.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => abrirLiqId(b.dataset.ver));
}

// VISTA: Tripulación del día (arrastrar personas a los vehículos)
// =====================================================================
let BUSCA_P = "";
let HIST_ABIERTO = new Set(), HIST_CERRADO = new Set(), HIST_TODAS = false;
const hayQ = (q, txt) => !q || sinTilde(q).split(/\s+/).filter(Boolean).every(w => sinTilde(txt).includes(w) || norm(txt).includes(norm(w)));
// todas las filas (vehículo) de una fecha: tripulación asignada y/o liquidación cargada
function vehiculosDelDia(fecha) {
  const ids = new Set(Object.keys(S.dias[fecha] || {}));
  Object.values(S.liqs).forEach(l => { if (l.fecha === fecha && l.pdf) ids.add(l.vehId); });
  return S.vehiculos.filter(v => ids.has(v.id));
}
function filasDia(fecha) {
  const ids = new Set(Object.keys(S.dias[fecha] || {}));
  Object.values(S.liqs).forEach(l => { if (l.fecha === fecha && l.pdf) ids.add(l.vehId); });
  return [...ids].flatMap(id => {
    const v = vehiculo(id) || { placa: "?", bk: "" }, ls = liqsDe(fecha, id).filter(l => l.pdf);
    return (ls.length ? ls : [null]).map(l => {
      const trip = l ? tripLiq(l) : tripDia(fecha, id).map(t => ({ personaId: t.personaId, nombre: t.p.nombre, dni: t.p.dni, funcion: t.funcion }));
      const txt = [v.placa, v.bk, l ? l.pdf.enc.viaje + " " + l.pdf.enc.placa + " " + l.pdf.enc.conductor : "", ...trip.map(t => t.nombre + " " + (t.dni || ""))].join(" ");
      return { v, l, trip, txt, c: l ? calc(l) : null, n: l ? nv(l) : 1, multi: ls.length > 1 };
    });
  }).sort((a, b) => a.v.placa.localeCompare(b.v.placa) || a.n - b.n);
}
function vTripulacion(m) {
  const dia = S.dias[FECHA] || {};
  const asignados = new Set(Object.values(dia).flat().map(t => t.personaId));
  const lista = S.personal.filter(p => hayQ(BUSCA_P, p.nombre + " " + p.dni));
  const delDia = vehiculosDelDia(FECHA), cerr = diaCerrado(FECHA);
  const vehsF = delDia.filter(v => hayQ(BUSCA_P, [v.placa, v.bk, ...tripDia(FECHA, v.id).map(t => t.p.nombre + " " + (t.p.dni || ""))].join(" ")));
  const fuera = S.vehiculos.filter(v => !delDia.includes(v));
  // historial
  const fechas = [...new Set([...Object.keys(S.dias).filter(d => Object.values(S.dias[d]).some(x => x.length)), ...Object.values(S.liqs).filter(l => l.pdf).map(l => l.fecha)])].sort().reverse();
  const hist = fechas.filter(fe => BUSCA_P || HIST_TODAS || fe === FECHA)
    .map(fe => ({ fe, filas: filasDia(fe).filter(r => hayQ(BUSCA_P, r.txt)) })).filter(h => h.filas.length);
  m.innerHTML = `
    <div class="card"><div class="row">
      <label class="f">Fecha<input type="date" id="trFecha" value="${FECHA}"></label>
      <label class="f grow">Buscar (nombre, DNI, placa, nombre comercial o viaje)<input id="trBusca" value="${esc(BUSCA_P)}" placeholder="Ej. 45879632, BMX-740, BK3788, Guillermo"></label>
      <button id="trLimpiar">Limpiar</button>
      ${cerr ? `<span class="tag ok" style="font-size:12.5px;padding:6px 12px">🔒 Tripulación cerrada el ${new Date(S.tripCerrada[FECHA].en).toLocaleString("es-PE")}</span>
        <button id="trReabrir">🔓 Reabrir (administrador)</button>`
      : `<button class="primary" id="trImportar">📷 Importar tripulación (imagen, PDF o Excel)</button>
      <button id="trCopiar">Copiar del día anterior</button>
      <button class="danger" id="trVaciar" ${Object.keys(dia).length ? "" : "disabled"}>Vaciar día</button>
      <button class="ok" id="trCerrar" ${Object.keys(dia).length ? "" : "disabled"}>🔒 Cerrar tripulación del día</button>`}
    </div>
    <div class="row" style="margin-top:10px;align-items:center">
      <span class="ayuda" style="margin:0">Se muestran solo los vehículos que salieron el <b>${fmtF(FECHA)}</b>${BUSCA_P ? " y coinciden con la búsqueda" : ""}. ${cerr ? " La tripulación está cerrada: no se puede modificar." : " Arrastra a cada persona hacia su vehículo (o usa “+ Agregar” en la tarjeta)."}</span>
      <div class="grow"></div>
      <select id="trAddVeh" ${fuera.length ? "" : "disabled"} ${cerr ? 'style="display:none"' : ""}><option value="">+ Agregar vehículo a este día…</option>${fuera.map(v => `<option value="${v.id}">${esc(v.placa)}${v.bk ? " — " + esc(v.bk) : ""}</option>`).join("")}</select>
    </div></div>
    ${!S.vehiculos.length || !S.personal.length ? `<div class="card m-warn">Primero registra ${!S.vehiculos.length ? "<b>vehículos</b>" : ""}${!S.vehiculos.length && !S.personal.length ? " y " : ""}${!S.personal.length ? "<b>personal</b>" : ""} en sus apartados del menú.</div>` : ""}
    <div class="dos">
      <div class="card"><h2>Personal (${lista.length}${lista.length !== S.personal.length ? " de " + S.personal.length : ""})</h2>
        <div class="chips">${lista.map(p => `<span class="chip ${asignados.has(p.id) ? "usado" : ""}" draggable="${cerr ? "false" : "true"}" data-p="${p.id}" title="DNI ${esc(p.dni)}">${esc(p.nombre)} <small>${esc(p.funcion || "")}</small></span>`).join("") || `<span class="vacio">Sin resultados.</span>`}</div>
      </div>
      <div class="grid-veh">${vehsF.length ? vehsF.map(v => {
        const t = tripDia(FECHA, v.id);
        return `<div class="veh" data-vt="${v.id}" style="cursor:default">
          <div class="vh"><span>${esc(v.placa)}${v.bk ? " — " + esc(v.bk) : ""}</span><span><span class="tag azul">${t.length}</span>${cerr || liqsDe(FECHA, v.id).some(l => l.pdf) ? "" : `<button class="x" data-quitveh="${v.id}" title="Quitar vehículo de este día">✕</button>`}</span></div>
          ${t.length ? `<table><thead><tr><th></th><th class="num">Función</th><th></th></tr></thead><tbody>${t.map(x => `<tr>
            <td>${esc(x.p.nombre)}${x.p.dni ? `<br><small class="ayuda">DNI ${esc(x.p.dni)}</small>` : ""}</td>
            <td class="num">${cerr ? `<b style="font-size:11.5px">${esc(x.funcion)}</b>` : `<select data-fun="${v.id}|${x.personaId}" style="padding:2px 4px;font-size:11px">${FUNCIONES.concat(FUNCIONES.includes(x.funcion) ? [] : [x.funcion]).map(f => `<option ${f === x.funcion ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>`}</td>
            <td>${cerr ? "" : `<button class="x" data-quitar="${v.id}|${x.personaId}">✕</button>`}</td></tr>`).join("")}</tbody></table>`
            : `<div class="sin">${cerr ? "Sin tripulación" : "Suelta aquí a la tripulación"}</div>`}
          ${cerr ? "" : `<div class="vf"><select data-add="${v.id}" style="width:100%;font-size:12px"><option value="">+ Agregar persona…</option>
            ${S.personal.filter(p => !asignados.has(p.id)).map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join("")}</select></div>`}
        </div>`; }).join("") : `<div class="card vacio">${delDia.length ? "Ningún vehículo coincide con la búsqueda." : `No hay vehículos registrados para el ${fmtF(FECHA)}. Usa <b>📷 Importar tripulación</b>, <b>Copiar del día anterior</b> o <b>+ Agregar vehículo a este día</b>.`}</div>`}</div>
    </div>
    <div class="row" style="margin-top:22px;align-items:center"><h2 style="margin:0">Historial de viajes ${BUSCA_P ? "que coinciden con “" + esc(BUSCA_P) + "”" : HIST_TODAS ? "(todas las fechas)" : "del " + fmtF(FECHA)}</h2>
      <div class="grow"></div>${BUSCA_P ? "" : `<button id="trTodas">${HIST_TODAS ? "Ver solo " + fmtF(FECHA) : "Ver todas las fechas"}</button>`}</div>
    <p class="ayuda">Haz clic en la fecha para ver los viajes cargados ese día, con placa, tripulación y montos.</p>
    ${hist.length ? hist.map(({ fe, filas }) => {
      const ab = HIST_ABIERTO.has(fe) ? !HIST_CERRADO.has(fe) : (!HIST_CERRADO.has(fe) && (fe === FECHA && !HIST_TODAS || (BUSCA_P && hist.length <= 3)));
      let pg = 0, ds = 0, aC = 0, fav = 0, nv = 0, nc = 0;
      filas.forEach(r => { if (r.c) { nv++; pg += r.c.pagado; ds += r.c.descontado; aC += r.c.aCobrar; fav += r.c.aFavor; if (r.l.estado === "cerrada") nc++; } });
      const dsem = new Date(fe + "T12:00:00").toLocaleDateString("es-PE", { weekday: "long" });
      return `<div class="dia-row ${ab ? "on" : ""}">
        <div class="dia-h" data-hist="${fe}">
          <span class="dia-f">${ab ? "▾" : "▸"} <b>${fmtF(fe)}</b> <small>${dsem}</small></span>
          <span>${filas.length} vehículo(s)</span><span>${nv} viaje(s) cargado(s)</span><span>${nc} cerrada(s)</span>
          <span>A cobrar <b>${soles(r2(aC), false)}</b></span><span>Pagado <b class="pos">${soles(r2(pg), false)}</b></span>
          <span>Descuento <b class="neg">${soles(r2(ds), false)}</b></span>${fav ? `<span>A favor <b class="pos">${soles(r2(fav), false)}</b></span>` : ""}
        </div>
        ${ab ? `<div class="scroll"><table><thead><tr><th>Placa — Nombre</th><th>Nº viaje</th><th>Conductor (PDF)</th><th>Tripulación</th><th>Estado</th><th class="num">Neto</th><th class="num">A cobrar</th><th class="num">Pagado</th><th class="num">Descuento</th><th></th></tr></thead><tbody>
          ${filas.map(r => `<tr><td><b>${esc(r.v.placa)}</b>${r.v.bk ? " — " + esc(r.v.bk) : ""}${r.multi || r.n > 1 ? `<br><span class="tag azul">Viaje ${r.n}</span>` : ""}</td>
            <td>${r.l ? esc(r.l.pdf.enc.viaje) : "—"}</td><td>${r.l ? esc(r.l.pdf.enc.conductor) : "—"}</td>
            <td style="font-size:12px">${r.trip.map(t => `${esc(t.nombre)} <small class="ayuda">(${esc(t.funcion)}${t.dni ? " · " + esc(t.dni) : ""})</small>`).join("<br>") || "—"}</td>
            <td>${estadoTag(r.l)}</td>
            <td class="num ${r.c ? cls(r.c.neto) : ""}">${r.c ? soles(r.c.neto) : "—"}</td><td class="num">${r.c ? soles(r.c.aCobrar, false) : "—"}</td>
            <td class="num pos">${r.c ? soles(r.c.pagado, false) : "—"}</td><td class="num neg">${r.c ? soles(r.c.descontado, false) : "—"}</td>

  $("trFecha").onchange = e => { FECHA = e.target.value || hoyISO(); $("fecha").value = FECHA; render(); };
  const b = $("trBusca");
  b.oninput = () => { BUSCA_P = b.value; clearTimeout(b._t); b._t = setTimeout(() => { const pos = b.selectionStart; render(); const n = $("trBusca"); n.focus(); n.setSelectionRange(pos, pos); }, 250); };
  $("trLimpiar").onclick = () => { BUSCA_P = ""; render(); };
  m.querySelectorAll("[data-hist]").forEach(h => h.onclick = () => {
    const fe = h.dataset.hist, abierta = h.parentElement.classList.contains("on");
    if (abierta) { HIST_ABIERTO.delete(fe); HIST_CERRADO.add(fe); } else { HIST_CERRADO.delete(fe); HIST_ABIERTO.add(fe); }
    render();
  });
  const tt = $("trTodas"); if (tt) tt.onclick = () => { HIST_TODAS = !HIST_TODAS; render(); };
  $("trAddVeh").onchange = e => { if (bloqueado(FECHA)) return; const id = e.target.value; if (!id) return; (S.dias[FECHA] = S.dias[FECHA] || {})[id] = (S.dias[FECHA] || {})[id] || []; guardar(); render(); };
  m.querySelectorAll("[data-quitveh]").forEach(x => x.onclick = () => { if (bloqueado(FECHA)) return;
    if (!x.dataset.ok) { x.dataset.ok = 1; x.textContent = "¿Quitar?"; setTimeout(() => { if (x.isConnected) { delete x.dataset.ok; x.textContent = "✕"; } }, 3000); return; }
    liqsDe(FECHA, x.dataset.quitveh).forEach(l => { if (!l.pdf) delete S.liqs[l.id]; });
    delete S.dias[FECHA][x.dataset.quitveh]; if (!Object.keys(S.dias[FECHA]).length) delete S.dias[FECHA];
    guardar(); render();
  });
  const ti = $("trImportar"); if (ti) ti.onclick = () => $("fileTrip").click();
  const tc = $("trCerrar"); if (tc) tc.onclick = async () => {
    if (!S.adminHash && !(await asegurarAdmin())) return;          // primero se crea la clave de administrador
    const sinRep = vehiculosDelDia(FECHA).filter(v => !tripDia(FECHA, v.id).some(t => t.funcion === "REPARTO")).map(v => v.placa);
    S.tripCerrada[FECHA] = { en: new Date().toISOString() }; guardar(); render();
    toast(`Tripulación del ${fmtF(FECHA)} cerrada.${sinRep.length ? " Atención: sin REPARTO en " + sinRep.join(", ") + "." : ""}`);
  };
  const tr = $("trReabrir"); if (tr) tr.onclick = async () => {
    if (!(await asegurarAdmin(`Ingresa la contraseña de administrador para reabrir la tripulación del ${fmtF(FECHA)}.`))) return;
    delete S.tripCerrada[FECHA]; guardar(); render(); toast("Tripulación reabierta. Ciérrala de nuevo al terminar los cambios.");
  };
  m.querySelectorAll("[data-ver]").forEach(x => x.onclick = () => abrirLiqId(x.dataset.ver));
  m.querySelectorAll("[data-irfecha]").forEach(x => x.onclick = () => { FECHA = x.dataset.irfecha; $("fecha").value = FECHA; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  m.querySelectorAll(".chip[data-p]").forEach(c => c.ondragstart = e => e.dataTransfer.setData("text/persona", c.dataset.p));
  if (!cerr) m.querySelectorAll("[data-vt]").forEach(card => {
    card.ondragover = e => { if ([...e.dataTransfer.types].includes("text/persona")) { e.preventDefault(); card.classList.add("over"); } };
    card.ondragleave = () => card.classList.remove("over");
    card.ondrop = e => { e.preventDefault(); card.classList.remove("over"); asignar(card.dataset.vt, e.dataTransfer.getData("text/persona")); };
  });
  m.querySelectorAll("[data-add]").forEach(s => s.onchange = () => { if (s.value) asignar(s.dataset.add, s.value); });
  m.querySelectorAll("[data-quitar]").forEach(x => x.onclick = () => { if (bloqueado(FECHA)) return;
    const [vid, pid] = x.dataset.quitar.split("|");
    S.dias[FECHA][vid] = S.dias[FECHA][vid].filter(t => t.personaId !== pid);
    guardar(); render();
  });
  m.querySelectorAll("[data-fun]").forEach(s => s.onchange = () => { if (bloqueado(FECHA)) return;
    const [vid, pid] = s.dataset.fun.split("|");
    const t = S.dias[FECHA][vid].find(t => t.personaId === pid); t.funcion = s.value; guardar();
  });
  if ($("trCopiar")) $("trCopiar").onclick = () => { if (bloqueado(FECHA)) return;
    const prev = Object.keys(S.dias).filter(d => d < FECHA && Object.keys(S.dias[d]).length).sort().pop();
    if (!prev) return toast("No hay un día anterior con tripulación.");
    S.dias[FECHA] = JSON.parse(JSON.stringify(S.dias[prev])); guardar(); render(); toast("Tripulación copiada del " + fmtF(prev) + ".");
  };
  if ($("trVaciar")) $("trVaciar").onclick = e => { if (bloqueado(FECHA)) return;
    const bt = e.target; if (!bt.dataset.ok) { bt.dataset.ok = 1; bt.textContent = "¿Seguro? Clic otra vez"; setTimeout(() => { if (bt.isConnected) { delete bt.dataset.ok; bt.textContent = "Vaciar día"; } }, 3000); return; }
    delete S.dias[FECHA]; guardar(); render();
  };
}
// =====================================================================
// Administrador: contraseña local (SHA-256) para reabrir una tripulación cerrada
// =====================================================================
function modalClave({ titulo, texto, crear }) {
  return new Promise(res => {
    const el = $("elige");
    el.innerHTML = `<div class="hoja" style="max-width:440px"><h2 style="color:var(--brand)">${titulo}</h2><p class="ayuda">${texto || ""}</p>
      <label class="f">Contraseña<input type="password" id="mk1" autocomplete="new-password"></label>
      ${crear ? `<label class="f" style="margin-top:8px">Repetir contraseña<input type="password" id="mk2" autocomplete="new-password"></label>` : ""}
      <div class="m-err" id="mkErr" style="min-height:18px;margin-top:6px;font-size:12.5px"></div>
      <div class="row" style="justify-content:flex-end"><button id="mkNo">Cancelar</button><button class="primary" id="mkOk">Aceptar</button></div></div>`;
    el.classList.add("on"); $("mk1").focus();
    const fin = v => { el.classList.remove("on"); el.innerHTML = ""; res(v); };
    const ok = () => { const a = $("mk1").value;
      if (a.length < 4) return $("mkErr").textContent = "Mínimo 4 caracteres.";
      if (crear && a !== $("mk2").value) return $("mkErr").textContent = "Las contraseñas no coinciden.";
      fin(a); };
    $("mkNo").onclick = () => fin(null); $("mkOk").onclick = ok;
    el.querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") ok(); });

    cobros.map(({ l, v, c }) => [fmtF(l.fecha), v.placa, v.bk, c.nombre, c.dni, c.tipo === "pago" ? "Pago" : "Descuento", c.tipo === "pago" ? c.medio : (c.modo === "tripulacion" ? "Partes iguales" : ""), c.monto]), [7]);
  guardarWb(wb, `trazabilidad_${hoyISO()}.xlsx`);
}

// En Claude usa su función de descargas; en cualquier otro sitio (GitHub Pages, tu PC) descarga normal.
async function descargar(nombre, blob) {
  if (window.claude && typeof window.claude.use === "function") {
    try { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename: nombre, data: blob }); toast("Archivo descargado."); return; } }
    catch (e) { if (e && e.code === "declined") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Archivo descargado.");
}
