<script>
// ===== Lector de "Acuerdo de liquidación de inventario" (independiente de la versión de pdf.js) =====
const SECCIONES = { "productos": "Productos", "bloqueados": "Bloqueados", "vacíos": "Vacíos", "vacios": "Vacíos", "activos": "Activos" };
const RE_RATIO = /^(\d+)\/(\d+)$/, RE_NUM = /^\d+$/, RE_DEN = /^\/(\d+)$/, RE_FECHA = /^\d{2}\/\d{2}\/\d{4}$/;

// items: [{str, x, top}] (top = distancia desde arriba). Une "3624" + "/1044" partidos en dos renglones.
function unirRatiosPartidos(items) {
  const usados = new Set(), nuevos = [];
  items.forEach((d, i) => {
    if (!RE_DEN.test(d.str)) return;
    let mejor = -1;
    items.forEach((n, j) => {
      if (usados.has(j) || !RE_NUM.test(n.str)) return;
      const dy = d.top - n.top;
      if (Math.abs(n.x - d.x) < 8 && dy > 0 && dy < 20 && (mejor < 0 || dy < d.top - items[mejor].top)) mejor = j;
    });
    if (mejor >= 0) {
      const n = items[mejor];
      usados.add(i); usados.add(mejor);
      nuevos.push({ str: n.str + d.str, x: n.x, top: (n.top + d.top) / 2 });
    }
  });
  return items.filter((_, k) => !usados.has(k)).concat(nuevos);
}

function agruparFilas(items, tol = 4) {
  const filas = [];
  [...items].sort((a, b) => a.top - b.top || a.x - b.x).forEach(it => {
    const f = filas[filas.length - 1];
    if (f && Math.abs(f.top - it.top) <= tol) f.items.push(it);
    else filas.push({ top: it.top, items: [it] });
  });
  filas.forEach(f => {
    f.items.sort((a, b) => a.x - b.x);
    f.tokens = []; // cada token conserva la x de su item
    f.items.forEach(it => it.str.split(/\s+/).filter(Boolean).forEach(t => f.tokens.push({ t, x: it.x })));
    f.texto = f.tokens.map(o => o.t).join(" ");
  });
  return filas;
}

// paginas: [{width, items:[{str,x,top}]}]
function parsearLiquidacion(paginas) {
  const enc = { conductor: "", viaje: "", placa: "", fechaEntrega: "", fechaRevision: "", revisor: "" };
  const lineas = [];
  let seccion = null;
  for (const pag of paginas) {
    const items = unirRatiosPartidos(pag.items.filter(i => i.str && i.str.trim()).map(i => ({ ...i, str: i.str.trim() })));
    const filas = agruparFilas(items);
    const mitad = pag.width / 2;
    filas.forEach((fila, k) => {
      const t = fila.texto, toks = fila.tokens.map(o => o.t);
      if (t.startsWith("Nombre del conductor") && filas[k + 1]) {
        if (!enc.viaje) {
          const vals = filas[k + 1].tokens.map(o => o.t);
          const fechas = vals.filter(v => RE_FECHA.test(v)), otros = vals.filter(v => !RE_FECHA.test(v));
          if (otros.length >= 3) {
            [enc.conductor, enc.viaje, enc.placa] = otros;
            enc.fechaEntrega = fechas[0] || ""; enc.fechaRevision = fechas[1] || "";
          }
        }
        return;
      }
      if (t.includes("Firma del revisor") && filas[k + 1] && !enc.revisor) {
        enc.revisor = filas[k + 1].tokens.filter(o => o.x < mitad).map(o => o.t).join(" ");
        return;
      }
      const primera = (toks[0] || "").toLowerCase();
      if (SECCIONES[primera] && t.includes("Inconsistencias")) { seccion = SECCIONES[primera]; return; }
      if (!seccion) return;
      const iR = toks.findIndex(x => RE_RATIO.test(x));
      if (iR < 2) return;
      const codigo = toks[iR - 1];
      if (!RE_NUM.test(codigo)) return;
      const [, x, y] = toks[iR].match(RE_RATIO);
      lineas.push({ seccion, codigo, nombre: toks.slice(0, iR - 1).join(" "),
        conductor: +x, sistema: +y, diferencia: (+x) - (+y) });
    });
  }
  return { enc, lineas };
}

// Lee un PDF (ArrayBuffer) con pdf.js y devuelve {enc, lineas}
async function leerPdf(pdfjsLib, buffer) {
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const paginas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    paginas.push({ width: vp.width, items: tc.items.map(it => ({ str: it.str, x: it.transform[4], top: vp.height - it.transform[5] })) });
  }
  return parsearLiquidacion(paginas);
}


// ===== Lector de la hoja de tripulación (imagen / PDF / Excel) =====
// Recibe palabras con posición {t, x0, x1, yc, h} y arma los bloques: placa, BK y tripulantes con su cargo.
const _st = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const RE_PLACA_T = /^(?:[A-Z]{2})?(?=[A-Z0-9]{0,2}[A-Z])[A-Z0-9]{3}-?\d{3}$/;
const RE_FECHA_T = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/;
function distEd(a, b) {   // distancia de edición (para tolerar errores de lectura: "Repario", "Chafer")
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const ROLES_T = [["CHOFER", ["chofer", "conductor", "piloto"]], ["REPARTO", ["reparto", "repartidor"]], ["AUXILIAR APOYO", ["apoyo"]], ["AUXILIAR", ["auxiliares", "auxiliar"]]];
function rolTrip(t) {
  const s = _st(t).replace(/[^a-z]/g, "");
  if (s.length < 3) return null;
  for (const [rol, ws] of ROLES_T) for (const w of ws) {
    if (s.length <= w.length && w.startsWith(s) && s.length >= 3) return rol;                 // "Aux", "Repart"
    if (s.length >= 5 && distEd(s.slice(0, w.length), w) <= Math.floor(w.length / 3)) return rol; // "Repario", "Chafer"
  }
  return null;
}
const limpiaPlaca = t => String(t).toUpperCase().replace(/[^A-Z0-9-]/g, "");
const esPlaca = t => RE_PLACA_T.test(limpiaPlaca(t)) && /\d/.test(t);
const esBK = t => /^BK[0-9OIl]{1,5}$/i.test(String(t).replace(/[^A-Za-z0-9]/g, ""));
const limpiaBK = t => { const x = String(t).replace(/[^A-Za-z0-9]/g, "").toUpperCase(); return "BK" + x.slice(2).replace(/O/g, "0").replace(/[IL]/g, "1"); };
const mediana = a => { if (!a.length) return 0; const b = [...a].sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };

function parseTripulacion(words) {
  const ENCAB = /^(funci[oó]n|cargo|nombres?|rol)$/i;
  words = words.map(w => ({ ...w, t: String(w.t).trim(), xc: (w.x0 + w.x1) / 2 }))
    .filter(w => w.t && /[A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]/.test(w.t));
  const hMed = mediana(words.map(w => w.h)) || 12, tol = hMed * 0.6;
  // fecha (la primera con formato dd/mm/aaaa)
  let fecha = null;
  const fw = words.find(w => RE_FECHA_T.test(w.t));
  if (fw) { const [, d, m, y] = fw.t.match(RE_FECHA_T); const yy = y.length === 2 ? "20" + y : y; fecha = `${yy}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`; }
  const placas = words.filter(w => esPlaca(w.t) && !esBK(w.t));
  if (!placas.length) return { fecha, bloques: [] };
  // ¿formato tarjeta (SEGSOL: "PLACA — BK" en una línea, función a la derecha) o formato hoja (BK debajo, cargo a la izquierda)?
  const bkMismaFila = p => words.find(w => esBK(w.t) && Math.abs(w.yc - p.yc) <= tol * 1.5 && w.x0 > p.x0 && w.x0 - p.x1 < (p.x1 - p.x0) * 3);
  const tarjeta = placas.filter(bkMismaFila).length > placas.length / 2;
  // filas de placas y espaciado
  const filasP = [];

    .sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(f => usar(l, f)));
  const hoy = hoyISO();
  Object.values(fuentes).forEach(f => { f.estado = f.saldo <= 0 ? "Aplicado" : hoy > f.vence ? "Vencido" : "Vigente"; });
  return (LIBRO = { base, fuentes, aplicado });
}
function calc(l) {
  const r = calcBase(l);
  const us = l.pdf ? (libro().aplicado[l.id] || []) : [];
  r.creditos = us; r.credito = r2(us.reduce((a, u) => a + u.monto, 0));
  r.aCobrar = r2(Math.max(0, r.aCobrarBase - r.credito));
  r.pendiente = r2(r.aCobrar - r.cubierto);
  r.fuente = l.pdf ? (libro().fuentes[l.id] || null) : null;
  return r;
}

function estadoTag(l) {
  if (!l || !l.pdf) return `<span class="tag ok">Pendiente</span>`;
  if (l.estado === "cerrada") return `<span class="tag pos">Cerrada</span>`;
  return `<span class="tag warn">En proceso</span>`;
}

async function leerArchivo(f) {
  const { enc, lineas } = await leerPdf(pdfjsLib, await f.arrayBuffer());
  if (!enc.viaje || !lineas.length) throw new Error('no parece un "Acuerdo de liquidación de inventario"');
  const m = String(enc.viaje).trim().match(/^R(\d+)[-_ ]?(.+)$/i);
  return { archivo: f.name, enc, lineas, base: m ? m[2] : enc.viaje.trim(), rep: m ? +m[1] : 0 };
}

// asigna un PDF leído a la liquidación (fecha, vehículo). Devuelve [clase, mensaje]
function asignarPdf(pdf, fecha, vehId, n = 1) {
  const v = vehiculo(vehId);
  const otra = Object.values(S.liqs).find(l => l.pdf && l.pdf.base === pdf.base && !(l.fecha === fecha && l.vehId === vehId && nv(l) === n));
  if (otra) {
    const vo = vehiculo(otra.vehId);
    if (otra.pdf.rep >= pdf.rep) return ["m-err", `${pdf.archivo}: el viaje ${pdf.base} ya está liquidado en ${vo ? vo.placa : "otro vehículo"} (${fmtF(otra.fecha)}${etqViaje(otra)}).`];
    if (otra.estado === "cerrada") return ["m-err", `${pdf.archivo}: es el reproceso R${pdf.rep} del viaje ${pdf.base}, pero esa liquidación (${fmtF(otra.fecha)}) ya está cerrada. Reábrela primero.`];
    delete S.liqs[otra.id];
  }
  let l = liqDe(fecha, vehId, n);
  if (l && l.estado === "cerrada") return ["m-err", `${pdf.archivo}: la liquidación de ${v.placa} (Viaje ${n}) ya está cerrada. Reábrela para cambiar el PDF.`];
  if (l && l.pdf && l.pdf.base === pdf.base && l.pdf.rep > pdf.rep) return ["m-warn", `${pdf.archivo}: ya está cargado el reproceso R${l.pdf.rep}, que es más reciente. Omitido.`];
  if (!l) { l = { id: uid(), creado: new Date().toISOString(), fecha, vehId, nviaje: n, cobros: [], estado: "abierta", incluirProductos: false, preciosProd: {} }; S.liqs[l.id] = l; }
  l.pdf = pdf; delete l.temporal;
  const aviso = placaCoincide(pdf.enc.placa, v.placa) ? "" : ` ⚠ La placa del PDF (${pdf.enc.placa}) no coincide con ${v.placa}.`;
  return [aviso ? "m-warn" : "m-ok", `${pdf.archivo}: viaje ${pdf.enc.viaje} cargado en ${v.placa}${v.bk ? " — " + v.bk : ""} como Viaje ${n}.${aviso}`];
}

async function cargarPdfs(files, vehId, abrir, nFijo) {
  MSGS = []; let ultimo = null;
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) { MSGS.push(["m-warn", `${f.name}: no es PDF, omitido.`]); continue; }
    try {
      const pdf = await leerArchivo(f);
      let destino = vehId;
      if (!destino) {
        const v = S.vehiculos.find(v => placaCoincide(v.placa, pdf.enc.placa));
        if (v) destino = v.id;
        else {   // placa nueva: se registra y se agrega a este día para poder liquidarla
          const nuevo = { id: uid(), placa: String(pdf.enc.placa).toUpperCase(), bk: "" };
          S.vehiculos.push(nuevo); destino = nuevo.id;
          MSGS.push(["m-warn", `${f.name}: la placa ${pdf.enc.placa} no estaba registrada; se creó el vehículo. Asígnale su BK y tripulación en Tripulación del día.`]);
        }
      }
      if (!diaCerrado(FECHA) && (S.dias[FECHA] === undefined || S.dias[FECHA][destino] === undefined)) {   // el vehículo liquidado figura en la tripulación del día
        (S.dias[FECHA] = S.dias[FECHA] || {})[destino] = (S.dias[FECHA] || {})[destino] || [];
      }
      let n = nFijo;
      if (!n) {
        const ls = liqsDe(FECHA, destino), conPdf = ls.filter(l => l.pdf);
        const mismo = conPdf.find(l => l.pdf.base === pdf.base);          // reproceso del mismo viaje
        if (mismo) n = nv(mismo);
        else if (!conPdf.length) n = ls.length ? nv(ls[0]) : 1;
        else { n = await elegirViaje(vehiculo(destino), pdf, FECHA); if (!n) { MSGS.push(["m-warn", `${f.name}: carga cancelada.`]); continue; } }
      }
      MSGS.push(asignarPdf(pdf, FECHA, destino, n));
      ultimo = liqDe(FECHA, destino, n);
    } catch (err) { console.error(err); MSGS.push(["m-err", `${f.name}: no se pudo leer (${err.message || err}).`]); }
  }
  guardar();
  if (abrir && vehId) { const l = ultimo || liqDe(FECHA, vehId, nFijo || 1); if (l) { LIQ_ABIERTA = l.id; } toastMsgs(); render(); pintarPanel(); }
  else render();
}
function toastMsgs() { const e = MSGS.find(m => m[0] !== "m-ok"); if (e) toast(e[1]); }

function pintarPanel() {

  const v = vehiculo(l.vehId) || { placa: "?", bk: "" };
  const c = calc(l), trip = tripLiq(l), cerrada = l.estado === "cerrada";
  const e = l.pdf ? l.pdf.enc : null;
  const secs = new Set((l.pdf ? l.pdf.lineas : []).map(x => x.seccion));
  $("panel").classList.add("on");
  $("hoja").innerHTML = `
    <div class="ptop"><h2>Detalle de liquidación — ${esc(v.placa)}${v.bk ? " — " + esc(v.bk) : ""} — Viaje ${nv(l)}</h2>
      <div class="row">${estadoTag(l)} <button id="pCerrar">✕ Cerrar</button></div></div>
    <div class="tabs"><div class="seg">${(() => { const ls = liqsDe(l.fecha, l.vehId).filter(x => x.pdf || x.id === l.id); const sig = Math.max(0, ...liqsDe(l.fecha, l.vehId).map(nv)) + 1;
      return ls.map(x => `<button data-tabv="${nv(x)}" class="${x.id === l.id ? "on" : ""}">Viaje ${nv(x)}${x.pdf ? ` · ${esc(x.pdf.enc.viaje)}` : ""}</button>`).join("")
        + (l.pdf ? `<button data-tabv="${sig}">➕ Viaje ${sig}</button>` : ""); })()}</div>
      <span class="ayuda" style="align-self:center;margin:0 0 0 8px">Si el vehículo hizo 2 viajes, cada viaje tiene su propia liquidación.</span></div>
    <div class="card" style="padding:12px 14px">
      <div class="row" style="align-items:center"><b>Tripulación (${fmtF(l.fecha)}):</b>
        ${trip.length ? trip.map(t => `<span class="chip" style="cursor:default">${esc(t.nombre)} <small>${esc(t.funcion)}${t.dni ? " · " + esc(t.dni) : ""}</small></span>`).join("")
          : `<span class="vacio">Sin tripulación asignada. Puedes asignarla en “Tripulación del día”.</span>`}</div>
    </div>
    ${!l.pdf ? `<div class="card"><div class="drop" id="pDrop"><b>Arrastra aquí el PDF de liquidación de ${esc(v.placa)}</b> o haz clic para elegirlo
        <small>Se leerán las diferencias de productos, bloqueados y vacíos.</small></div><div class="msgs">${MSGS.map(([k, t]) => `<div class="${k}">${esc(t)}</div>`).join("")}</div></div>` : `
    <div class="enc">
      <div><span>Conductor</span><b>${esc(e.conductor)}</b></div>
      <div><span>Nº de viaje</span><b>${esc(e.viaje)}</b></div>
      <div><span>Placa</span><b>${esc(e.placa)}</b></div>
      <div><span>Fecha de entrega</span><b>${esc(e.fechaEntrega)}</b></div>
      <div><span>Fecha de revisión</span><b>${esc(e.fechaRevision)}</b></div>
      <div><span>Revisor</span><b>${esc(e.revisor)}</b></div>
    </div>
    ${!placaCoincide(e.placa, v.placa) ? `<div class="card m-warn" style="padding:10px 14px">⚠ La placa del PDF (${esc(e.placa)}) no coincide con el vehículo ${esc(v.placa)}.</div>` : ""}
    <div class="kpis">
      <div class="kpi"><span>Botellas (neto)</span><b class="${cls(c.bot)}">${und(c.bot)}</b></div>
      <div class="kpi"><span>Cajas (neto)</span><b class="${cls(c.caj)}">${und(c.caj)}</b></div>
      <div class="kpi"><span>Sobrante</span><b class="pos">${soles(c.sobr)}</b></div>
      <div class="kpi"><span>Faltante</span><b class="neg">${soles(c.falt)}</b></div>
      <div class="kpi"><span>Neto</span><b class="${cls(c.neto)}">${soles(c.neto)}</b></div>
    </div>
    ${tablaSeccion("Productos", secs.has("Productos"), c.lineas, "productos", l)}
    ${l.incluirProductos && c.prodSinPrecio ? `<p class="ayuda m-warn">Hay ${c.prodSinPrecio} producto(s) sin precio: no suman al cobro hasta que les pongas precio.</p>` : ""}
    ${tablaSeccion("Bloqueados", secs.has("Bloqueados"), c.lineas, "otros", l)}
    ${tablaSeccion("Vacíos", secs.has("Vacíos"), c.lineas, "vacios", l)}
    ${(() => { const sp = c.lineas.filter(x => x.seccion === "Vacíos" && x.precio == null); return sp.length ? `<p class="ayuda m-warn">⚠ ${sp.length} envase(s) sin precio no suman al cobro: ${sp.map(x => esc(x.nombre)).join(", ")}. No se pudo saber si es caja o botella ni su medida.</p>` : ""; })()}
    ${secs.has("Activos") ? tablaSeccion("Activos", true, c.lineas, "otros", l) : ""}
    <p class="ayuda">Archivo: ${esc(l.pdf.archivo)}${l.pdf.rep ? ` · Reproceso R${l.pdf.rep}` : ""}
      ${!cerrada ? ` · <a href="#" id="pCambiar">Cambiar PDF</a>` : ""}</p>
    ${seccionAjustes(l)}
    ${seccionCobro(l, c, trip)}`}`;

  $("pCerrar").onclick = cerrarPanel;
  $("hoja").querySelectorAll("[data-tabv]").forEach(b => b.onclick = () => abrirLiq(l.fecha, l.vehId, +b.dataset.tabv));
  const pd = $("pDrop");
  if (pd) {
    pd.onclick = () => { $("filePdf").dataset.veh = l.vehId; $("filePdf").click(); };
    pd.ondragover = ev => { ev.preventDefault(); pd.classList.add("over"); };
    pd.ondragleave = () => pd.classList.remove("over");
    pd.ondrop = ev => { ev.preventDefault(); pd.classList.remove("over"); FECHA_PDF(l); cargarPdfs([...ev.dataTransfer.files].slice(0, 1), l.vehId, true, nv(l)); };
    pd.onclick = () => { FECHA_PDF(l); $("filePdf").dataset.veh = l.vehId; $("filePdf").dataset.n = nv(l); $("filePdf").click(); };
  }
  const pc = $("pCambiar");
  if (pc) pc.onclick = ev => { ev.preventDefault(); FECHA_PDF(l); $("filePdf").dataset.veh = l.vehId; $("filePdf").dataset.n = nv(l); $("filePdf").click(); };
  const chk = $("chkProd");
  if (chk) chk.onchange = () => { l.incluirProductos = chk.checked; guardar(); pintarPanel(); render(); };
  $("hoja").querySelectorAll("input.precio").forEach(inp => inp.onchange = () => {
    const val = inp.value === "" ? null : Math.max(0, +inp.value);
    l.preciosProd = l.preciosProd || {};
    if (val == null) delete l.preciosProd[inp.dataset.cod]; else { l.preciosProd[inp.dataset.cod] = val; S.preciosProd[inp.dataset.cod] = val; }
    guardar(); pintarPanel(); render();
  });
  if (chk && chk.checked) {   // precarga precios recordados
    let cambio = false;
    c.lineas.filter(x => x.seccion === "Productos").forEach(x => {
      if ((l.preciosProd || {})[x.codigo] == null && S.preciosProd[x.codigo] != null) { l.preciosProd[x.codigo] = S.preciosProd[x.codigo]; cambio = true; }
    });
    if (cambio) { guardar(); pintarPanel(); return; }
  }
  enlazarAjustes(l);
  enlazarCobro(l, c, trip);
}

function seccionAjustes(l) {
  const cerrada = l.estado === "cerrada";
  const aj = l.ajustes || [];
  const efecto = a => a.codigo === "ZPD7" ? `Quita faltante (+${a.cantidad})` : a.codigo === "ZPD4" ? `Agrega faltante (−${a.cantidad})` : "Comentario";
  const mats = l.pdf.lineas.map((x, i) => ({ x, i })).sort((a, b) => (b.x.diferencia !== 0) - (a.x.diferencia !== 0));
  return `
    <h3>Ajustes y comentarios (ZPD7 / ZPD4) ${aj.length ? `<span class="tag azul">${aj.length}</span>` : ""}</h3>
    <p class="ayuda" style="margin-top:0"><b>ZPD7</b> quita mercadería faltante (−24 con ZPD7 24 → 0). <b>ZPD4</b> agrega faltante (−24 con ZPD4 24 → −48). El ajuste cambia la diferencia y el dinero de la liquidación.</p>
    ${aj.length ? `<div class="card scroll" style="padding:0"><table><thead><tr><th>Código</th><th>Material</th><th class="num">Cantidad</th><th>Efecto</th><th>Comentario</th><th>Registrado</th><th></th></tr></thead><tbody>
      ${aj.map(a => `<tr><td><span class="tag ${a.codigo === "ZPD7" ? "pos" : a.codigo === "ZPD4" ? "neg" : "ok"}">${esc(a.codigo === "COMENTARIO" ? "Nota" : a.codigo)}</span></td>
        <td>${a.mat ? esc(a.seccion + " · " + a.codigoMat + " — " + a.nombre) : "—"}</td><td class="num">${a.codigo === "COMENTARIO" ? "—" : a.cantidad}</td>
        <td>${efecto(a)}</td><td>${esc(a.comentario || "")}</td><td style="font-size:11.5px;color:var(--muted)">${new Date(a.fecha).toLocaleString("es-PE")}</td>
        <td>${cerrada ? "" : `<button class="x" data-delaj="${a.id}" title="Quitar">✕</button>`}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    ${cerrada ? "" : `<div class="cobro-form">
      <div class="row">
        <label class="f">Código<select id="ajCod"><option value="" selected>— Elige una opción —</option><option value="ZPD7">ZPD7 – quita faltante</option><option value="ZPD4">ZPD4 – agrega faltante</option><option value="COMENTARIO">Solo comentario</option></select></label>
        <label class="f grow" id="ajMatW">Material<select id="ajMat">${mats.map(({ x, i }) => `<option value="${i}">${esc(x.seccion)} · ${esc(x.codigo)} — ${esc(x.nombre)} (PDF ${und(x.diferencia)})</option>`).join("")}</select></label>
        <label class="f" id="ajCantW">Cantidad<input id="ajCant" type="number" min="1" step="1" style="width:100px"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="f grow">Comentario<input id="ajCom" placeholder="Ej. ZPD7 aprobado por supervisor, botellas devueltas en almacén"></label>
        <button class="primary" id="ajAdd">Agregar</button>
      </div>
      <div class="msgs"><div class="m-err" id="ajErr"></div></div>
    </div>`}`;
}
function enlazarAjustes(l) {
  const h = $("hoja");
  h.querySelectorAll("[data-delaj]").forEach(b => b.onclick = () => { l.ajustes = (l.ajustes || []).filter(a => a.id !== b.dataset.delaj); guardar(); pintarPanel(); render(); });
  const cod = $("ajCod"); if (!cod) return;
  const toggle = () => { const sc = cod.value === "COMENTARIO" || !cod.value; $("ajCantW").style.display = sc ? "none" : ""; $("ajMatW").style.display = cod.value ? "" : "none"; };
  cod.onchange = toggle; toggle();
  $("ajAdd").onclick = () => {
    const err = t => $("ajErr").textContent = t;
    const codigo = cod.value, com = $("ajCom").value.trim();
    if (!codigo) return err("Elige una opción: ZPD7, ZPD4 o Solo comentario.");
    const x = l.pdf.lineas[+$("ajMat").value];
    const a = { id: uid(), codigo, comentario: com, fecha: new Date().toISOString(), cantidad: 0, mat: "", seccion: "", codigoMat: "", nombre: "" };
    if (codigo === "COMENTARIO") {
      if (!com) return err("Escribe el comentario.");
      if (x) Object.assign(a, { mat: x.seccion + "|" + x.codigo, seccion: x.seccion, codigoMat: x.codigo, nombre: x.nombre });
    } else {
      const cant = Math.round(+$("ajCant").value);
      if (!x) return err("Elige el material.");
      if (!(cant > 0)) return err("Ingresa la cantidad (número entero mayor a 0).");
      Object.assign(a, { cantidad: cant, mat: x.seccion + "|" + x.codigo, seccion: x.seccion, codigoMat: x.codigo, nombre: x.nombre });
    }
    (l.ajustes = l.ajustes || []).push(a);
    guardar(); pintarPanel(); render();
  };
}
// el PDF que se carga desde el panel va a la fecha de la liquidación abierta
function FECHA_PDF(l) { FECHA = l.fecha; $("fecha").value = FECHA; }

function seccionCobro(l, c, trip) {
  const cerrada = l.estado === "cerrada";
  const filas = (l.cobros || []).map(x => `<tr>
      <td><span class="tag ${x.tipo === "pago" ? "pos" : "neg"}">${x.tipo === "pago" ? "Pago" : "Descuento"}</span></td>
      <td>${esc(x.nombre)}${x.dni ? `<br><small class="ayuda">DNI ${esc(x.dni)}</small>` : ""}</td>
      <td>${x.tipo === "pago" ? esc(x.medio) + (x.operacion ? ` · Op. ${esc(x.operacion)}` : "") + `${x.recibe ? ` · Recibió: ${esc(x.recibe)}` : ""}` : esc({ persona: "Tripulante", tripulacion: "Toda la tripulación (partes iguales)", otro: "Otra persona" }[x.modo] || "")}</td>
      <td class="num"><b>${soles(x.monto, false)}</b></td>
      <td>${cerrada ? "" : `<button class="x" data-delcob="${x.id}" title="Quitar">✕</button>`}</td></tr>`).join("");
  const opcTrip = trip.map(t => `<option value="${esc(t.personaId)}">${esc(t.nombre)} (${esc(t.funcion)})</option>`).join("");
  const otrasP = S.personal.filter(p => !trip.some(t => t.personaId === p.id)).map(p => `<option value="${esc(p.id)}">${esc(p.nombre)}${p.dni ? " · " + esc(p.dni) : ""}</option>`).join("");

  let form = "";
  if (!cerrada && c.pendiente > 0) {
    const montoDef = c.pendiente.toFixed(2);
    form = `<div class="cobro-form">
      <div class="row" style="margin-bottom:10px">
        <div class="seg"><button data-tipo="pago" class="${FORM.tipo === "pago" ? "on" : ""}">💵 Registrar pago</button><button data-tipo="descuento" class="${FORM.tipo === "descuento" ? "on" : ""}">📉 Enviar a descuento</button><button data-tipo="neteo" class="${FORM.tipo === "neteo" ? "on" : ""}">🔄 Neteo</button></div>
      </div>
      ${FORM.tipo === "neteo" ? formNeteo(l, trip) : FORM.tipo === "pago" ? `
      <div class="row">
        <label class="f grow">¿Quién paga?
          <select id="cPersona">${opcTrip ? `<option value="" selected>— Elige un tripulante —</option>${opcTrip}` : `<option value="">— Este vehículo no tiene tripulación asignada —</option>`}</select></label>
        <label class="f" id="cOtroWrap" style="display:none">Nombre<input id="cOtroNombre" placeholder="Nombre completo"></label>
        <label class="f" id="cOtroDniWrap" style="display:none">DNI<input id="cOtroDni" placeholder="DNI" inputmode="numeric"></label>
        <label class="f">Medio<select id="cMedio">${MEDIOS.map(x => `<option>${x}</option>`).join("")}</select></label>
        <label class="f">Nº operación<input id="cOp" placeholder="Opcional" style="width:120px"></label>
        <label class="f">Responsable que recibe el dinero<input id="cRecibe" list="dlRecibe" value="${esc(S.ultimoReceptor || "")}" placeholder="Nombre de quien recibe" style="width:200px"></label>
        <datalist id="dlRecibe">${(S.receptores || []).map(r => `<option value="${esc(r)}">`).join("")}</datalist>
        <label class="f">Monto (S/)<input id="cMonto" type="number" step="0.01" min="0.01" value="${montoDef}" style="width:110px"></label>
        <button class="primary" id="cAgregar">Agregar pago</button>
      </div>` : `
      <div class="row">
        <label class="f">Descontar a
          <select id="cModo">
            <option value="persona" ${FORM.modo === "persona" ? "selected" : ""}>Un tripulante</option>
            <option value="tripulacion" ${FORM.modo === "tripulacion" ? "selected" : ""} ${trip.length ? "" : "disabled"}>Toda la tripulación (partes iguales)</option>
            <option value="otro" ${FORM.modo === "otro" ? "selected" : ""}>Otra persona</option>
          </select></label>
        ${FORM.modo === "persona" ? `<label class="f grow">Tripulante<select id="cPersona">${opcTrip || `<option value="">— sin tripulación —</option>`}</select></label>` : ""}
        ${FORM.modo === "otro" ? `<label class="f grow">Persona<select id="cPersona">${otrasP}<option value="__otro">Escribir nombre…</option></select></label>
          <label class="f" id="cOtroWrap" style="display:none">Nombre<input id="cOtroNombre" placeholder="Nombre completo"></label>
          <label class="f" id="cOtroDniWrap" style="display:none">DNI<input id="cOtroDni" placeholder="DNI" inputmode="numeric"></label>` : ""}
        ${FORM.modo === "tripulacion" ? `<div class="grow ayuda" style="margin:0 0 8px">Se dividirá entre ${trip.length} persona(s): ${trip.map(t => esc(t.nombre)).join(", ")}.</div>` : ""}
        <label class="f">Monto (S/)<input id="cMonto" type="number" step="0.01" min="0.01" value="${montoDef}" style="width:110px"></label>
        <button class="primary" id="cAgregar">Agregar descuento</button>
      </div>`}
      <div class="msgs"><div class="m-err" id="cErr"></div></div>
    </div>`;
  }
  return `
    <h3>Cobro de la liquidación</h3>
    <div class="estado-cobro">
      ${c.aFavor ? `<div>Sobrante a favor<br><b class="pos">${soles(c.aFavor, false)}</b></div>` : ""}
      ${c.credito ? `<div>Faltante neto<br><b>${soles(c.aCobrarBase, false)}</b></div><div>Saldo a favor aplicado<br><b class="pos">−${soles(c.credito, false)}</b></div>` : ""}
      <div>A cobrar${c.credito ? "" : " (neto)"}<br><b>${soles(c.aCobrar, false)}</b></div>
      <div>Pagado<br><b class="pos">${soles(c.pagado, false)}</b></div>
      <div>Descuento<br><b class="neg">${soles(c.descontado, false)}</b></div>
      <div>Pendiente<br><b class="${c.pendiente > 0 ? "neg" : "pos"}">${soles(Math.max(c.pendiente, 0), false)}</b></div>
      <div style="margin-left:auto" class="row">
        ${cerrada ? `<span class="ayuda" style="margin:0">Cerrada el ${new Date(l.cerradaEn).toLocaleString("es-PE")}</span><button id="cReabrir">Reabrir</button>`
          : `<button class="ok" id="cCerrarLiq" ${c.pendiente === 0 ? "" : "disabled"} title="${c.pendiente > 0 ? "Falta cubrir el monto pendiente con pagos o descuentos" : ""}">✔ Cerrar liquidación</button>`}
      </div>
    </div>
    ${c.creditos.map(u => `<p class="ayuda pos" style="margin:6px 0 0">✔ Se cubrió ${soles(u.monto, false)} con el saldo a favor de <b>${esc(u.nombre)}</b> (${u.manual ? "neteo del sobrante" : "sobrante"} del ${fmtF(u.fecha)}).</p>`).join("")}
    ${infoSaldo(l, c, trip)}
    ${c.aCobrar === 0 && !cerrada ? `<p class="ayuda">No hay nada que cobrar. Puedes cerrar la liquidación.</p>` : ""}
    ${!cerrada && c.pendiente > 0 ? `<p class="ayuda m-warn" style="margin:6px 0 0">Para cerrar, cubre los <b>${soles(c.pendiente, false)}</b> pendientes con un pago, un descuento o un neteo.</p>` : ""}
    ${c.pendiente < 0 ? `<p class="ayuda m-err">Lo registrado supera lo que se debe cobrar en ${soles(-c.pendiente, false)}. Quita o corrige algún pago o descuento.</p>` : ""}
    ${filas ? `<div class="card scroll" style="padding:0;margin-top:10px"><table><thead><tr><th>Tipo</th><th>Persona</th><th>Medio / detalle</th><th class="num">Monto</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>` : ""}
    ${listaNeteos(l)}
    ${form}
    ${cerrada ? (l.comentarioCierre ? `<div class="card" style="margin-top:10px;padding:12px 14px"><b>💬 Comentario de cierre:</b> ${esc(l.comentarioCierre)}</div>` : "")
      : `<label class="f" style="margin-top:12px">💬 Comentario de cierre (opcional)<textarea id="cComent" placeholder="Ej. Se coordinó con el supervisor; el chofer devolverá las cajas mañana.">${esc(l.comentarioCierre || "")}</textarea></label>`}`;
}
function infoSaldo(l, c, trip) {
  if (!c.aFavor) return "";
  const f = c.fuente, box = t => `<div class="card" style="margin-top:10px;padding:10px 14px;border-color:#bfe3c9;background:#f3fbf5">${t}</div>`;
  if (l.estado !== "cerrada") {
    const rep = trip.find(t => String(t.funcion).toUpperCase() === "REPARTO");
    if (rep) return box(`💚 Al cerrar, el sobrante de <b>${soles(c.aFavor, false)}</b> quedará como saldo a favor de <b>${esc(rep.nombre)}</b> (REPARTO) para cubrir sus faltantes hasta el <b>${fmtF(addDias(l.fecha, DIAS_SALDO))}</b>.`);
    const v = vehiculo(l.vehId) || {};
    return box(!trip.length
      ? `⚠ <b>${esc(v.placa)}</b> no tiene tripulación asignada el ${fmtF(l.fecha)}. Asígnala en <b>Tripulación del día</b> (con su REPARTO) antes de cerrar; si no, el sobrante de ${soles(c.aFavor, false)} quedará solo en el historial.`
      : `⚠ En la tripulación de <b>${esc(v.placa)}</b> nadie tiene el rol <b>REPARTO</b> (${trip.map(t => esc(t.nombre) + ": " + esc(t.funcion)).join(" · ")}). Corrige la función en <b>Tripulación del día</b> antes de cerrar; si no, el sobrante de ${soles(c.aFavor, false)} quedará solo en el historial.`);
  }
  if (!f) return box(`El sobrante de ${soles(c.aFavor, false)} quedó solo en el historial (no había tripulante con rol REPARTO).`);
  const est = { Vigente: `<span class="tag pos">Vigente hasta ${fmtF(f.vence)}</span>`, Aplicado: `<span class="tag azul">Aplicado</span>`, Vencido: `<span class="tag ok">Vencido el ${fmtF(f.vence)} · queda en historial</span>` }[f.estado];
  return box(`💚 Saldo a favor de <b>${esc(f.owner.nombre)}</b> (REPARTO): ${soles(f.monto, false)} · disponible <b>${soles(Math.max(f.saldo, 0), false)}</b> ${est}
    ${f.usos.map(u => { const v = vehiculo(u.l.vehId) || {}; return `<div class="ayuda" style="margin:4px 0 0">Usado ${soles(u.monto, false)} en ${esc(v.placa)} (${fmtF(u.l.fecha)})${u.l.estado !== "cerrada" ? " · liquidación en proceso" : ""}</div>`; }).join("")}`);
}

// ---------- Neteo: sobrante de días anteriores (no liquidado en el sistema) → saldo a favor por 3 días
const TIPOS_NETEO = () => [["caja", "Caja", S.precios.caja], ["grande", "Botella de 600 ml o más", S.precios.grande], ["chica", "Botella de 599 ml o menos", S.precios.chica]];
function formNeteo(l, trip) {
  const N = FORM.neteo = FORM.neteo || { fecha: addDias(l.fecha, -1), items: [{ tipo: "caja", cant: "" }, { tipo: "grande", cant: "" }], monto: "", montoTocado: false, persona: "", com: "" };
  if (!N.persona) { const rep = trip.find(t => t.funcion === "REPARTO"); N.persona = rep ? rep.personaId : ""; }
  const T = TIPOS_NETEO(), tp = k => T.find(x => x[0] === k);
  const sub = N.items.map(it => r2((+it.cant || 0) * tp(it.tipo)[2])), total = r2(sub.reduce((a, b) => a + b, 0));
  if (!N.montoTocado) N.monto = total ? total.toFixed(2) : "";
  return `<p class="ayuda" style="margin-top:0">Registra un <b>sobrante de un día anterior</b> que no se liquidó en el sistema. Queda como saldo a favor del tripulante y se aplica automáticamente a sus faltantes hasta <b>${DIAS_SALDO} días</b> después de la fecha del sobrante; luego vence y queda en el historial.</p>
    <div class="row">
      <label class="f">Fecha del sobrante<input type="date" id="nFecha" value="${N.fecha}" min="${addDias(l.fecha, -DIAS_SALDO)}" max="${addDias(l.fecha, -1)}"></label>
      <label class="f grow">Saldo a favor de<select id="nPersona">${trip.length ? `<option value="">— Elige un tripulante —</option>` + trip.map(t => `<option value="${esc(t.personaId)}" ${t.personaId === N.persona ? "selected" : ""}>${esc(t.nombre)} (${esc(t.funcion)})</option>`).join("") : `<option value="">— Este vehículo no tiene tripulación asignada —</option>`}</select></label>
    </div>
    <div class="card scroll" style="padding:0;margin:10px 0 0"><table><thead><tr><th>Producto sobrante</th><th class="num" style="width:120px">Cantidad</th><th class="num" style="width:80px">Precio</th><th class="num" style="width:110px">Monto</th><th style="width:30px"></th></tr></thead><tbody>
      ${N.items.map((it, i) => `<tr><td><select data-ni="${i}" data-nk="tipo">${T.map(t => `<option value="${t[0]}" ${t[0] === it.tipo ? "selected" : ""}>${t[1]}</option>`).join("")}</select></td>
        <td class="num"><input data-ni="${i}" data-nk="cant" type="number" min="0" step="1" value="${esc(it.cant)}" style="width:100px;text-align:right"></td>
        <td class="num">${tp(it.tipo)[2].toFixed(2)}</td><td class="num pos">${soles(sub[i], false)}</td>
        <td>${N.items.length > 1 ? `<button class="x" data-nquita="${i}" title="Quitar">✕</button>` : ""}</td></tr>`).join("")}
      <tr><td colspan="3"><button id="nMas" class="mini">+ Agregar producto</button></td><td class="num"><b>${soles(total, false)}</b></td><td></td></tr>
    </tbody></table></div>
    <div class="row" style="margin-top:10px">
      <label class="f grow">Comentario<input id="nCom" value="${esc(N.com)}" placeholder="Ej. 2 cajas y 12 botellas del 15/11, no liquidadas en el sistema"></label>
      <label class="f">Monto del neteo (S/)<input id="nMonto" type="number" step="0.01" min="0.01" value="${esc(N.monto)}" style="width:120px"></label>
      <button class="primary" id="nAgregar">Agregar neteo</button>
    </div>`;
}
function listaNeteos(l) {
  const ms = (S.saldosManuales || []).filter(m => m.liqId === l.id); if (!ms.length) return "";
  const F = libro().fuentes;
  return `<div class="card scroll" style="padding:0;margin-top:10px"><table><thead><tr><th>🔄 Neteo</th><th>Saldo a favor de</th><th>Productos</th><th class="num">Monto</th><th>Uso</th><th></th></tr></thead><tbody>
    ${ms.map(m => { const f = F["m:" + m.id], usado = f ? r2(m.monto - Math.max(f.saldo, 0)) : 0, enCerrada = f && f.usos.some(u => u.l.estado === "cerrada" && u.l.id !== l.id);
      return `<tr><td>Sobrante del <b>${fmtF(m.fecha)}</b><br><small class="ayuda">vence ${fmtF(addDias(m.fecha, DIAS_SALDO))}</small></td><td>${esc(m.nombre)}</td>
        <td style="font-size:12.5px">${m.items.map(it => `${it.cantidad} ${esc(it.tipo)}`).join(" · ")}${m.comentario ? `<br><small class="ayuda">${esc(m.comentario)}</small>` : ""}</td>
        <td class="num pos"><b>${soles(m.monto, false)}</b></td>
        <td style="font-size:12.5px">${f ? `Aplicado ${soles(usado, false)} · ${f.estado === "Vigente" ? `disponible ${soles(Math.max(f.saldo, 0), false)}` : f.estado}` : ""}</td>
        <td>${l.estado === "cerrada" || enCerrada ? "" : `<button class="x" data-delnet="${m.id}" title="Quitar">✕</button>`}</td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function enlazarCobro(l, c, trip) {
  const h = $("hoja");
  h.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { FORM.tipo = b.dataset.tipo; pintarPanel(); });
  const modo = $("cModo"); if (modo) modo.onchange = () => { FORM.modo = modo.value; pintarPanel(); };
  const sel = $("cPersona");
  const toggleOtro = () => { const o = sel && sel.value === "__otro"; ["cOtroWrap", "cOtroDniWrap"].forEach(id => { const x = $(id); if (x) x.style.display = o ? "" : "none"; }); };
  if (sel) { sel.onchange = toggleOtro; toggleOtro(); }
  h.querySelectorAll("[data-delcob]").forEach(b => b.onclick = () => {
    const x = l.cobros.find(k => k.id === b.dataset.delcob);
    l.cobros = l.cobros.filter(k => x.grupo ? k.grupo !== x.grupo : k.id !== x.id);
    guardar(); pintarPanel(); render();
  });
  h.querySelectorAll("[data-delnet]").forEach(b => b.onclick = () => { S.saldosManuales = S.saldosManuales.filter(m => m.id !== b.dataset.delnet); guardar(); pintarPanel(); render(); });
  if (FORM.tipo === "neteo" && $("nAgregar")) {
    const N = FORM.neteo, T = TIPOS_NETEO();
    $("nFecha").onchange = e => { N.fecha = e.target.value; pintarPanel(); };
    $("nPersona").onchange = e => { N.persona = e.target.value; };
    $("nCom").oninput = e => { N.com = e.target.value; };
    $("nMonto").oninput = e => { N.monto = e.target.value; N.montoTocado = true; };
    h.querySelectorAll("[data-ni]").forEach(el => el.onchange = () => { N.items[+el.dataset.ni][el.dataset.nk] = el.value; pintarPanel(); });
    h.querySelectorAll("[data-nquita]").forEach(b => b.onclick = () => { N.items.splice(+b.dataset.nquita, 1); pintarPanel(); });
    $("nMas").onclick = () => { N.items.push({ tipo: "chica", cant: "" }); pintarPanel(); };
    $("nAgregar").onclick = () => {
      const err = t => { $("cErr").textContent = t; };
      if (!N.fecha) return err("Indica la fecha del sobrante.");
      if (N.fecha >= l.fecha) return err("La fecha del sobrante debe ser anterior a la de esta liquidación.");
      if (addDias(N.fecha, DIAS_SALDO) < l.fecha) return err(`El sobrante del ${fmtF(N.fecha)} ya venció: el plazo es de ${DIAS_SALDO} días (hasta el ${fmtF(addDias(N.fecha, DIAS_SALDO))}).`);
      const p = trip.find(t => t.personaId === N.persona); if (!p) return err("Elige a qué tripulante pertenece el sobrante.");
      const items = N.items.filter(it => +it.cant > 0).map(it => { const t = T.find(x => x[0] === it.tipo); return { tipo: t[1], cantidad: +it.cant, precio: t[2], monto: r2(+it.cant * t[2]) }; });
      if (!items.length) return err("Agrega al menos un producto con su cantidad.");
      const monto = r2(+N.monto); if (!(monto > 0)) return err("Ingresa el monto del neteo.");
      (S.saldosManuales = S.saldosManuales || []).push({ id: uid(), fecha: N.fecha, personaId: p.personaId, nombre: p.nombre, dni: p.dni || "", monto, items,
        comentario: N.com.trim(), liqId: l.id, creado: new Date().toISOString() });
      FORM.neteo = null; FORM.tipo = "pago";
      guardar(); pintarPanel(); render(); toast(`Neteo de ${soles(monto, false)} registrado como saldo a favor de ${p.nombre}.`);
    };
  }
  const add = $("cAgregar");
  if (add) add.onclick = () => {
    const err = t => { $("cErr").textContent = t; };
    const monto = r2(+$("cMonto").value);
    if (!(monto > 0)) return err("Ingresa un monto mayor a 0.");
    if (monto > c.pendiente + 0.001) return err(`El monto no puede superar lo pendiente (${soles(c.pendiente, false)}).`);
    const quien = () => {
      if (!sel || !sel.value) return null;
      if (sel.value === "__otro") {
        const n = $("cOtroNombre").value.trim(); if (!n) return null;
        return { personaId: null, nombre: n, dni: $("cOtroDni").value.trim() };
      }
      const p = persona(sel.value); return p ? { personaId: p.id, nombre: p.nombre, dni: p.dni || "" } : null;
    };
    if (FORM.tipo === "pago") {
      const q = quien(); if (!q) return err(trip.length ? "Elige quién de la tripulación realiza el pago." : "Este vehículo no tiene tripulación asignada: asígnala en Tripulación del día.");
      const recibe = $("cRecibe").value.trim().toUpperCase();
      if (!recibe) return err("Indica el responsable que recibe el dinero.");
      S.ultimoReceptor = recibe; S.receptores = [...new Set([recibe, ...(S.receptores || [])])].slice(0, 30);
      l.cobros.push({ id: uid(), tipo: "pago", ...q, medio: $("cMedio").value, operacion: $("cOp").value.trim(), recibe, monto, modo: "persona", fecha: new Date().toISOString() });
    } else if (FORM.modo === "tripulacion") {
      if (!trip.length) return err("No hay tripulación asignada.");
      const cent = Math.round(monto * 100), base = Math.floor(cent / trip.length), resto = cent - base * trip.length, grupo = uid();
      trip.forEach((t, i) => l.cobros.push({ id: uid(), tipo: "descuento", personaId: t.personaId, nombre: t.nombre, dni: t.dni || "", monto: (base + (i < resto ? 1 : 0)) / 100, modo: "tripulacion", grupo, fecha: new Date().toISOString() }));
    } else {
      const q = quien(); if (!q) return err("Indica a quién se le descuenta.");
      l.cobros.push({ id: uid(), tipo: "descuento", ...q, monto, modo: FORM.modo, fecha: new Date().toISOString() });
    }
    guardar(); pintarPanel(); render();
  };
  const cm = $("cComent");
  if (cm) cm.oninput = () => { l.comentarioCierre = cm.value; clearTimeout(cm._t); cm._t = setTimeout(() => guardar(), 400); };
  const cl = $("cCerrarLiq");
  if (cl) cl.onclick = () => {
    LIBRO = null;
    const cc = calc(l); if (cc.pendiente !== 0) return;
    l.creditos = cc.creditos.map(u => ({ ...u }));
    if (cm) l.comentarioCierre = cm.value.trim();
    l.estado = "cerrada"; l.cerradaEn = new Date().toISOString();
    l.precios = { ...S.precios }; l.tripulacion = tripLiq({ ...l, estado: "abierta" });
    guardar(); toast("Liquidación cerrada."); pintarPanel(); render();
  };
  const ra = $("cReabrir");
  if (ra) ra.onclick = () => {
    if (!ra.dataset.ok) { ra.dataset.ok = 1; ra.textContent = "¿Seguro? Clic otra vez"; setTimeout(() => { if (ra.isConnected) { delete ra.dataset.ok; ra.textContent = "Reabrir"; } }, 3000); return; }
    const f = libro().fuentes[l.id];
    if (f && f.usos.some(u => u.l.estado === "cerrada")) return toast("Su saldo a favor ya se usó en otra liquidación cerrada. Reabre primero esa.");
    l.estado = "abierta"; delete l.cerradaEn; delete l.creditos; guardar(); pintarPanel(); render();
  };
}

      <div class="kpi"><span>Faltante</span><b class="neg">${soles(r2(fal))}</b></div>
      <div class="kpi"><span>Total a cobrar</span><b>${soles(r2(aC), false)}</b></div>
      <div class="kpi"><span>Total pagado</span><b class="pos">${soles(r2(pg), false)}</b></div>
      <div class="kpi"><span>Total descuento</span><b class="neg">${soles(r2(ds), false)}</b></div>

      ${Object.keys(porColab).length ? `<table><thead><tr><th>Colaborador</th><th>DNI</th><th>Vehículo(s)</th><th class="num">Pagado</th><th class="num">Descontado</th><th class="num">Total</th><th></th></tr></thead><tbody>

    el.classList.add("on"); $("mk1").focus();

async function asegurarAdmin(motivo) {
  if (!S.adminHash) {
    const c = await modalClave({ titulo: "Crear contraseña de administrador", crear: true,
      texto: "Aún no hay administrador. Crea la contraseña que se pedirá para reabrir una tripulación cerrada. Guárdala bien: solo quien la conozca podrá modificar una tripulación cerrada." });
    if (!c) return false;

function confirmarImport() {
  const I = IMP, F = I.fecha; if (!F) return toast("Indica la fecha.");
  const dudas = I.bloques.filter(b => b.incluir).flatMap(b => b.miembros.filter(m => m.sel === "__elegir").map(m => `${m.nombre} (${b.placa})`));
  if (dudas.length) return toast(`Elige a quién corresponde: ${dudas.join(", ")}. Hay más de una persona registrada con ese nombre.`);
  if (bloqueado(F)) return;
  const dia = S.dias[F] = S.dias[F] || {};
  let nv = 0, np = 0, nt = 0; const creados = {};
  I.bloques.filter(b => b.incluir && b.placa).forEach(b => {
    let v = (b.vehId && vehiculo(b.vehId)) || S.vehiculos.find(x => placaCoincide(x.placa, b.placa));
    if (!v) { v = { id: uid(), placa: b.placa, bk: b.bk || "" }; S.vehiculos.push(v); nv++; }
    else if (b.bk && (!v.bk || b.bkTocado)) v.bk = b.bk;
    const lista = [];
    b.miembros.forEach(m => {
      const nom = (m.nombre || "").trim().toUpperCase();
      if (m.sel === "__omitir" || !nom) return;
      let p = m.sel !== "__nuevo" ? persona(m.sel) : null;
      if (!p) { p = { id: uid(), nombre: nom, dni: "", funcion: m.funcion }; S.personal.push(p); np++; }   // homónimos: cada fila nueva es una persona distinta
      else if (_st(p.nombre) !== _st(nom)) {
        const tk = x => _st(x).replace(/[^a-z\s]/g, " ").split(/\s+/).filter(t => t.length > 1);
        const corto = tk(p.nombre), largo = tk(nom);
        if (largo.length > corto.length && corto.every(x => largo.some(t => t === x || distEd(t, x) <= 1))) {   // llegó el nombre completo: se actualiza
          p.alias = [...new Set([...(p.alias || []), p.nombre])]; p.nombre = nom;
        } else p.alias = [...new Set([...(p.alias || []), nom])];   // recordar cómo figura en la hoja
      }
      if (lista.some(t => t.personaId === p.id)) return;
      Object.keys(dia).forEach(k => { if (k !== v.id) dia[k] = dia[k].filter(t => t.personaId !== p.id); });
      lista.push({ personaId: p.id, funcion: m.funcion }); nt++;
    });
    dia[v.id] = lista;
  });
  guardar(); FECHA = F; $("fecha").value = F; IMP = null; $("panel").classList.remove("on"); render();
  toast(`Tripulación del ${fmtF(F)} cargada: ${nt} persona(s)${nv ? `, ${nv} vehículo(s) nuevo(s)` : ""}${np ? `, ${np} persona(s) nueva(s)` : ""}.`);
}
$("fileTrip").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  panelImp(`<div class="ptop"><h2>Importar tripulación</h2><button id="impX">✕ Cerrar</button></div>
    <div class="card"><b id="impEstado">Leyendo ${esc(f.name)}…</b><div class="barra"><i id="impBar"></i></div>
    <p class="ayuda">La lectura se hace en tu navegador. La primera vez que subes una imagen se descarga el lector de texto (unos segundos).</p></div>`);
  $("impX").onclick = cerrarImp;
  const prog = p => { const b = $("impBar"), s2 = $("impEstado"); if (b) b.style.width = Math.max(3, p) + "%"; if (s2) s2.textContent = `Leyendo el texto… ${p}%`; };
  try {
    let words;
    if (/\.xlsx$/i.test(f.name)) words = await palabrasExcel(f);
    else if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") words = await palabrasPdf(f, prog);
    else if ((f.type || "").startsWith("image/") || /\.(png|jpe?g|webp|bmp)$/i.test(f.name)) { $("impEstado").textContent = "Preparando la imagen…"; words = await ocrCanvas(await imagenACanvas(f), prog); }
    else throw new Error("Formato no soportado. Usa una imagen (JPG/PNG), un PDF o el Excel (.xlsx).");
    abrirImportador(parseTripulacion(words), f.name);
  } catch (err) {
    console.error(err);
    panelImp(`<div class="ptop"><h2>Importar tripulación</h2><button id="impX">✕ Cerrar</button></div><div class="card m-err">No se pudo leer el archivo: ${esc(err.message || err)}</div>`);
    $("impX").onclick = cerrarImp;
  }
};
function asignar(vehId, personaId) {
  if (bloqueado(FECHA)) return;
  const p = persona(personaId); if (!p) return;
  const dia = S.dias[FECHA] = S.dias[FECHA] || {};
  // si ya estaba en otro vehículo ese día, se mueve
  Object.keys(dia).forEach(k => { dia[k] = dia[k].filter(t => t.personaId !== personaId); });
  (dia[vehId] = dia[vehId] || []).push({ personaId, funcion: p.funcion || "AUXILIAR" });
  guardar(); render();
}

const COLOR = { ROJO: { color: { argb: "FFC62828" }, bold: true }, VERDE: { color: { argb: "FF1E8E3E" }, bold: true } };
const MONEY = '#,##0.00;-#,##0.00';
function hoja(wb, nombre, cols, rows, moneyCols = [], signCol = null) {
  const ws = wb.addWorksheet(nombre, { views: [{ state: "frozen", ySplit: 1 }] });
  ws.addRow(cols);
  ws.getRow(1).eachCell(c => { c.font = { bold: true, color: { argb: "FFFFFFFF" } }; c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF3B3591" } }; c.alignment = { horizontal: "center" }; });
  rows.forEach(r => {
    const row = ws.addRow(r);
    moneyCols.forEach(i => row.getCell(i + 1).numFmt = MONEY);
    if (signCol != null && typeof r[signCol] === "number" && r[signCol] !== 0) row.getCell(signCol + 1).font = r[signCol] > 0 ? COLOR.VERDE : COLOR.ROJO;
  });
  ws.columns.forEach(col => { let w = 10; col.eachCell({ includeEmpty: false }, c => { w = Math.max(w, String(c.value ?? "").length + 2); }); col.width = Math.min(w, 45); });
  return ws;
}
async function guardarWb(wb, nombre) {
  if (typeof ExcelJS === "undefined") return toast("No se pudo cargar la librería de Excel (revisa tu internet).");
  const buf = await wb.xlsx.writeBuffer();
  descargar(nombre, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}
function filasLiq(ls) {
  return ls.map(l => { const c = calc(l), v = vehiculo(l.vehId) || {}, e = l.pdf.enc;
    return [fmtF(l.fecha), v.placa, v.bk, e.viaje, e.placa, e.conductor, e.revisor, tripLiq(l).map(t => `${t.nombre} (${t.funcion})`).join(", "),
      l.estado === "cerrada" ? "Cerrada" : "En proceso", c.bot, c.caj, c.sobr, c.falt, c.neto, c.aFavor, c.credito, c.aCobrar, c.pagado, c.descontado, c.pendiente,
      (l.ajustes || []).filter(a => a.codigo !== "COMENTARIO").map(a => `${a.codigo} ${a.cantidad} ${a.codigoMat}`).join("; "), l.comentarioCierre || "", nv(l)]; });
}
const COLS_LIQ = ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Placa PDF", "Conductor PDF", "Revisor", "Tripulación", "Estado", "Botellas", "Cajas", "Sobrante S/", "Faltante S/", "Neto S/", "Sobrante a favor S/", "Saldo a favor aplicado S/", "A cobrar S/", "Pagado S/", "Descuento S/", "Pendiente S/", "Ajustes ZPD", "Comentario de cierre", "Viaje del día"];
function filasCobros(ls, tipo) {
  const out = [];
  ls.forEach(l => { const v = vehiculo(l.vehId) || {};
    (l.cobros || []).filter(c => c.tipo === tipo).forEach(c => out.push(tipo === "pago"
      ? [fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje, c.nombre, c.dni, c.medio, c.operacion || "", c.recibe || "", c.monto]
      : [fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje, c.nombre, c.dni, c.modo === "tripulacion" ? "Partes iguales (tripulación)" : c.modo === "otro" ? "Otra persona" : "Tripulante", c.monto])); });
  return out;
}
function filasDif(items) {
  return items.map(({ l, v, trip, x }) => [fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje, trip.map(t => t.nombre).join(", "), trip.map(t => t.dni).filter(Boolean).join(", "),
    x.seccion, x.codigo, x.nombre, x.conductor, x.sistema, x.difPdf ?? x.diferencia, x.ajuste || 0, x.diferencia, x.tipo || "", x.precio, x.dinero]);
}
const COLS_DIF = ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Tripulación", "DNI tripulación", "Sección", "Código", "Descripción", "Conductor (cant.)", "Sistema (cant.)", "Dif. PDF", "Ajuste ZPD", "Diferencia final", "Tipo envase", "Precio", "Dinero S/"];
function exportarReporte(ls, desde, hasta) {
  if (typeof ExcelJS === "undefined") return toast("No se pudo cargar la librería de Excel (revisa tu internet).");
  const wb = new ExcelJS.Workbook();
  // Cuadre de caja: dinero recibido por día y medio de pago
  const porDia = {};
  ls.forEach(l => {
    const c = calc(l), d = porDia[l.fecha] = porDia[l.fecha] || { medios: {}, desc: 0, saldo: 0, aCobrar: 0, pend: 0, n: 0, abiertas: 0 };
    d.n++; if (l.estado !== "cerrada") d.abiertas++;
    d.desc = r2(d.desc + c.descontado); d.saldo = r2(d.saldo + c.credito); d.aCobrar = r2(d.aCobrar + c.aCobrar); d.pend = r2(d.pend + Math.max(c.pendiente, 0));
    (l.cobros || []).filter(x => x.tipo === "pago").forEach(x => d.medios[x.medio] = r2((d.medios[x.medio] || 0) + x.monto));
  });
  const filasCaja = Object.keys(porDia).sort().map(fe => { const d = porDia[fe]; const rec = r2(MEDIOS.reduce((a, mm) => a + (d.medios[mm] || 0), 0));
    return [fmtF(fe), d.n, d.abiertas, d.aCobrar, ...MEDIOS.map(mm => d.medios[mm] || 0), rec, d.desc, d.saldo, d.pend]; });
  const tot = ["TOTAL", 0, 0, ...Array(MEDIOS.length + 5).fill(0)];
  filasCaja.forEach(r => r.forEach((v, i) => { if (i > 0) tot[i] = r2(tot[i] + v); }));
  filasCaja.push(tot);
  const wcaja = hoja(wb, "Cuadre de caja", ["Fecha", "Liquidaciones", "Sin cerrar", "A cobrar S/", ...MEDIOS.map(mm => mm + " S/"), "Total recibido S/", "Descontado S/", "Saldo a favor aplicado S/", "Pendiente S/"],
    filasCaja, [3, ...MEDIOS.map((_, i) => 4 + i), 4 + MEDIOS.length, 5 + MEDIOS.length, 6 + MEDIOS.length, 7 + MEDIOS.length]);
  wcaja.lastRow.font = { bold: true };
  wcaja.orderNo = -2;
  hoja(wb, "Liquidaciones", COLS_LIQ, filasLiq(ls), [11, 12, 13, 14, 15, 16, 17, 18, 19], 13);
  const filasPago = filasCobros(ls, "pago");
  hoja(wb, "Pagos", ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Pagó", "DNI", "Medio", "Nº operación", "Recibió", "Monto S/"], filasPago, [9]);
  const resp = {}; filasPago.forEach(r => { const k = r[8] || "(sin registrar)", o = resp[k] = resp[k] || { n: 0, t: 0, m: {} }; o.n++; o.t = r2(o.t + r[9]); o.m[r[6]] = r2((o.m[r[6]] || 0) + r[9]); });
  const filasResp = Object.entries(resp).map(([k, o]) => [k, o.n, ...MEDIOS.map(mm => o.m[mm] || 0), o.t]);
  filasResp.push(["TOTAL", filasResp.reduce((a, r) => a + r[1], 0), ...MEDIOS.map((_, i) => r2(filasResp.reduce((a, r) => a + r[2 + i], 0))), r2(filasResp.reduce((a, r) => a + r[2 + MEDIOS.length], 0))]);
  const wresp = hoja(wb, "Por responsable", ["Responsable que recibe", "Pagos", ...MEDIOS.map(mm => mm + " S/"), "Total recibido S/"], filasResp, [...MEDIOS.map((_, i) => 2 + i), 2 + MEDIOS.length]);
  wresp.lastRow.font = { bold: true };
  hoja(wb, "Descuentos", ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Persona", "DNI", "Tipo", "Monto S/"], filasCobros(ls, "descuento"), [7]);
  const col = {};
  ls.forEach(l => (l.cobros || []).forEach(x => { const k = (x.dni || "") + "|" + x.nombre; const p = col[k] = col[k] || [x.nombre, x.dni, 0, 0, 0];
    if (x.tipo === "pago") p[2] = r2(p[2] + x.monto); else p[3] = r2(p[3] + x.monto); p[4] = r2(p[2] + p[3]); }));
  const filasCol = Object.values(col).sort((a, b) => a[0].localeCompare(b[0]));
  filasCol.push(["TOTAL", "", r2(filasCol.reduce((a, r) => a + r[2], 0)), r2(filasCol.reduce((a, r) => a + r[3], 0)), r2(filasCol.reduce((a, r) => a + r[4], 0))]);
  const wc = hoja(wb, "Por colaborador", ["Colaborador", "DNI", "Pagado S/", "Descontado S/", "Total S/"], filasCol, [2, 3, 4]);
  wc.lastRow.font = { bold: true };
  wc.orderNo = -1;
  const items = []; ls.forEach(l => { const v = vehiculo(l.vehId) || {}, trip = tripLiq(l); calc(l).lineas.forEach(x => items.push({ l, v, trip, x })); });
  hoja(wb, "Diferencias", COLS_DIF, filasDif(items), [15, 16], 13);
  const ajs = []; ls.forEach(l => { const v = vehiculo(l.vehId) || {}; (l.ajustes || []).forEach(a => ajs.push([fmtF(l.fecha), v.placa, v.bk, l.pdf.enc.viaje,
    a.codigo === "COMENTARIO" ? "Nota" : a.codigo, a.seccion, a.codigoMat, a.nombre, a.codigo === "COMENTARIO" ? "" : a.cantidad,
    a.codigo === "ZPD7" ? "Quita faltante" : a.codigo === "ZPD4" ? "Agrega faltante" : "", a.comentario || ""])); });
  const ids = new Set(ls.map(l => l.id)), FU = libro().fuentes;
  hoja(wb, "Neteos", ["Fecha del sobrante", "Vence", "Saldo a favor de", "DNI", "Productos", "Monto S/", "Aplicado S/", "Disponible S/", "Estado", "Registrado en", "Comentario"],
    (S.saldosManuales || []).filter(m => ids.has(m.liqId) || (m.fecha >= addDias(desde, -DIAS_SALDO) && m.fecha <= hasta)).map(m => { const f = FU["m:" + m.id] || { saldo: m.monto, estado: "" }, lr = S.liqs[m.liqId], v = lr ? vehiculo(lr.vehId) || {} : {};
      return [fmtF(m.fecha), fmtF(addDias(m.fecha, DIAS_SALDO)), m.nombre, m.dni, m.items.map(it => it.cantidad + " " + it.tipo).join(", "), m.monto, r2(m.monto - Math.max(f.saldo, 0)), r2(Math.max(f.saldo, 0)), f.estado,
        lr ? `${v.placa || ""} ${fmtF(lr.fecha)}${etqViaje(lr)}` : "", m.comentario || ""]; }), [5, 6, 7]);
  hoja(wb, "Ajustes y comentarios", ["Fecha", "Placa", "Nombre comercial", "Nº viaje", "Código", "Sección", "Material", "Descripción", "Cantidad", "Efecto", "Comentario"], ajs);
  guardarWb(wb, `cuadre_caja_${desde}${hasta !== desde ? "_al_" + hasta : ""}.xlsx`);
}
function exportarTraza(f, cobros) {
  const wb = new ExcelJS.Workbook();
  hoja(wb, "Faltantes y sobrantes", COLS_DIF, filasDif(f), [15, 16], 13);
  hoja(wb, "Pagos y descuentos", ["Fecha", "Placa", "Nombre comercial", "Persona", "DNI", "Tipo", "Detalle", "Monto S/"],
    cobros.map(({ l, v, c }) => [fmtF(l.fecha), v.placa, v.bk, c.nombre, c.dni, c.tipo === "pago" ? "Pago" : "Descuento", c.tipo === "pago" ? c.medio : (c.modo === "tripulacion" ? "Partes iguales" : ""), c.monto]), [7]);
  guardarWb(wb, `trazabilidad_${hoyISO()}.xlsx`);
}

// En Claude usa su función de descargas; en cualquier otro sitio (GitHub Pages, tu PC) descarga normal.
async function descargar(nombre, blob) {
  if (window.claude && typeof window.claude.use === "function") {
    try { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename: nombre, data: blob }); toast("Archivo descargado."); return; } }
    catch (e) { if (e && e.code === "declined") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Archivo descargado.");
}
